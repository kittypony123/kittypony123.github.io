      const utils = {

        // Debounce function
        debounce: (func, delay) => {

          return (...args) => {

        // Format date consistently
        formatDate: (date) => {
          return debug.safeExecute(() => {
            if (!date) return '';

            return d.toISOString().split('T')[0];

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Safe array operation
        safeFilter: (array, predicate) => {

          if (!str || typeof str !== 'string') return '';

        downloadBlob: (blob, filename) => {

          document.body.appendChild(link);
          link.click();

        // Performance helper
        throttle: (func, delay) => {
          let timeoutId;
          let lastExecTime = 0;
          return function (...args) {
            const currentTime = Date.now();
            if (currentTime - lastExecTime > delay) {
              func.apply(this, args);
              lastExecTime = currentTime;
            } else {
              clearTimeout(timeoutId);
              timeoutId = setTimeout(() => {

                lastExecTime = Date.now();
              }, delay - (currentTime - lastExecTime));

      const validators = {

          if (value && value.length < min) {

          }
          return null;
        },
        
        maxLength: (max) => (value, fieldName = 'Field') => {
          if (value && value.length > max) {
            return `${fieldName} must be no more than ${max} characters`;
          }
          return null;
        },
        
        pattern: (regex, message) => (value) => {
          if (value && !regex.test(value)) {
            return message;
          }
          return null;
        },
        
        // Validate form data with multiple validators
        validateForm: (formData, rules) => {
          const errors = {};
          
          for (const [field, fieldRules] of Object.entries(rules)) {
            const value = formData[field];
            
            for (const rule of fieldRules) {
              const error = typeof rule === 'function'

                : rule.validator(value, utils.capitalize(field));
              
              if (error) {
                errors[field] = error;
                break; // Stop at first error for this field
              }
            }
          }
          
          return {
            isValid: Object.keys(errors).length === 0,

      const useLocalStorage = (key, initialValue) => {
        const [storedValue, setStoredValue] = React.useState(() => {
          try {
            const item = window.localStorage.getItem(key);
            return item ? JSON.parse(item) : initialValue;
          } catch (error) {
            debug.warn(`Error reading localStorage key "${key}":`, error);
            return initialValue;
          }
        });

        const setValue = (value) => {
          try {
            setStoredValue(value);
            window.localStorage.setItem(key, JSON.stringify(value));
            debug.log(`Saved to localStorage: ${key}`);
          } catch (error) {
            debug.error(`Error setting localStorage key "${key}":`, error);
          }
        };

        return [storedValue, setValue];

      /**********************************************************************
       * ComplianceDetailModal Component – Detailed view of compliance requirements
       **********************************************************************/
      const ComplianceDetailModal = ({ compliance, onClose, assets = [], onAssetSelect }) => {
        const modalRef = React.useRef(null);
        
        React.useEffect(() => {
          // Focus management for accessibility
          if (modalRef.current) {
            modalRef.current.focus();
          }
          
          // Trap focus within modal
          const handleKeyDown = (e) => {
            if (e.key === 'Tab') {
              const focusableElements = modalRef.current?.querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
              );
              if (focusableElements?.length) {
                const firstElement = focusableElements[0];
                const lastElement = focusableElements[focusableElements.length - 1];
                
                if (!e.shiftKey && document.activeElement === lastElement) {
                  e.preventDefault();
                  firstElement.focus();
                } else if (e.shiftKey && document.activeElement === firstElement) {
                  e.preventDefault();
                  lastElement.focus();
                }
              }
            }
          };
          
          document.addEventListener('keydown', handleKeyDown);
          return () => document.removeEventListener('keydown', handleKeyDown);
        }, []);
        
        if (!compliance) return null;

        const getStatusColor = (status) => {
          switch (status?.toLowerCase()) {
            case 'compliant':
            case 'active':
              return 'bg-green-100 text-green-800 border-green-200';
            case 'non-compliant':
            case 'expired':
              return 'bg-red-100 text-red-800 border-red-200';
            case 'pending':
            case 'under review':
              return 'bg-yellow-100 text-yellow-800 border-yellow-200';
            case 'not applicable':
              return 'bg-gray-100 text-gray-800 border-gray-200';
            default:
              return 'bg-blue-100 text-blue-800 border-blue-200';
          }
        };

        const getCriticalityColor = (criticality) => {
          switch (criticality?.toLowerCase()) {
            case 'high':
              return 'bg-red-50 text-red-700 border-red-200';
            case 'medium':
              return 'bg-yellow-50 text-yellow-700 border-yellow-200';
            case 'low':
              return 'bg-green-50 text-green-700 border-green-200';
            default:
              return 'bg-gray-50 text-gray-700 border-gray-200';
          }
        };

        const formatDate = (dateString) => {
          if (!dateString || dateString === 'null') return 'Not specified';
          try {
            return new Date(dateString).toLocaleDateString('en-GB', {
              year: 'numeric',
              month: 'long',
              day: 'numeric'
            });
          } catch {
            return dateString;
          }
        };

        // Get linked assets for this compliance
        const linkedAssets = (compliance.linkedAssetIDs || [])
          .map(assetId => assets.find(asset => asset.id.toString() === assetId.toString()))
          .filter(asset => asset);

        return (
          <div className="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" onClick={(e) => e.target === e.currentTarget && onClose()}>

              ref={modalRef}

              aria-modal="true"
              aria-labelledby="compliance-modal-title"

            >
              {/* Header */}
              <div className="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4 text-white">
                <div className="flex items-center justify-between">
                  <div className="flex items-center">
                    <div className="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center mr-3">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.031 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                      </svg>
                    </div>
                    <div>
                      <h2 id="compliance-modal-title" className="text-xl font-bold">{compliance.title || compliance.name}</h2>
                      <p className="text-blue-100 text-sm">Compliance Requirement Details</p>
                    </div>
                  </div>
                  <button 
                    onClick={onClose}
                    className="w-8 h-8 flex items-center justify-center rounded-lg bg-white bg-opacity-20 hover:bg-opacity-30 transition-colors"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>

              <div className="overflow-y-auto max-h-[calc(90vh-100px)]">

                    <div className="md:col-span-2">
                      <h3 className="text-lg font-semibold text-gray-900 mb-3">Description</h3>
                      <p className="text-gray-700 leading-relaxed">
                        {compliance.description || 'No description available for this compliance requirement.'}
                      </p>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label className="text-xs font-medium text-gray-500 uppercase tracking-wide">Status</label>
                        <div className={`mt-1 px-3 py-2 rounded-lg border text-sm font-medium ${getStatusColor(compliance.status)}`}>
                          {compliance.status || 'Active'}
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-medium text-gray-500 uppercase tracking-wide">Criticality</label>
                        <div className={`mt-1 px-3 py-2 rounded-lg border text-sm font-medium ${getCriticalityColor(compliance.criticality)}`}>
                          {compliance.criticality || 'Medium'}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Detailed Information */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <div>
                        <label className="text-sm font-semibold text-gray-900">Compliance ID</label>
                        <p className="text-gray-700 font-mono text-sm bg-gray-100 px-2 py-1 rounded mt-1">
                          {compliance.complianceID}
                        </p>
                      </div>
                      <div>
                        <label className="text-sm font-semibold text-gray-900">Regulatory Body</label>
                        <p className="text-gray-700 mt-1">
                          {compliance.regulatoryBody || 'Not specified'}
                        </p>
                      </div>
                      <div>
                        <label className="text-sm font-semibold text-gray-900">Category</label>
                        <p className="text-gray-700 mt-1">
                          {compliance.category || 'Regulatory Compliance'}
                        </p>
                      </div>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label className="text-sm font-semibold text-gray-900">Effective Date</label>
                        <p className="text-gray-700 mt-1">
                          {formatDate(compliance.effectiveDate)}
                        </p>
                      </div>
                      <div>
                        <label className="text-sm font-semibold text-gray-900">Review Frequency</label>
                        <p className="text-gray-700 mt-1">
                          {compliance.reviewFrequency || 'Not specified'}
                        </p>
                      </div>
                      <div>
                        <label className="text-sm font-semibold text-gray-900">Next Review Due</label>
                        <p className="text-gray-700 mt-1">
                          {compliance.nextReviewDate ? formatDate(compliance.nextReviewDate) : 'To be determined'}
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Linked Assets */}
                  <div>
                    <h3 className="text-lg font-semibold text-gray-900 mb-4">Linked Assets ({linkedAssets.length})</h3>
                    {linkedAssets.length > 0 ? (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {linkedAssets.map(asset => (
                          <div 
                            key={asset.id} 
                            className="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow cursor-pointer hover:border-blue-300"
                            onClick={() => {
                              if (onAssetSelect) {
                                onClose(); // Close compliance modal first
                                onAssetSelect(asset); // Open asset detail
                              }
                            }}
                          >
                            <div className="flex items-start">
                              <div className="flex-shrink-0 w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center mr-3">
                                <svg className="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                                </svg>
                              </div>
                              <div className="flex-1">
                                <h4 className="font-medium text-gray-900 hover:text-blue-600 transition-colors">{asset.name}</h4>
                                <p className="text-sm text-gray-600 mt-1">{asset.description}</p>
                                <div className="flex items-center mt-2 space-x-4 text-xs text-gray-500">
                                  <span>Type: {asset.type}</span>
                                  <span>Owner: {asset.owner}</span>
                                  <span className={`px-2 py-1 rounded ${
                                    asset.complianceCriticality === 'High' ? 'bg-red-100 text-red-700' :
                                    asset.complianceCriticality === 'Medium' ? 'bg-yellow-100 text-yellow-700' :
                                    'bg-green-100 text-green-700'
                                  }`}>
                                    {asset.complianceCriticality} Risk
                                  </span>
                                </div>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="text-center py-8 text-gray-500">
                        <svg className="w-12 h-12 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 009.586 13H7"/>
                        </svg>
                        <p>No assets are currently linked to this compliance requirement</p>
                      </div>
                    )}
                  </div>

                  {/* Actions */}
                  <div className="border-t pt-6 flex justify-end space-x-3">
                    <button 
                      onClick={onClose}
                      className="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
                    >
                      Close
                    </button>
                    <button 
                      onClick={() => {
                        // Generate single compliance requirement report
                        const linkedAssets = (compliance.linkedAssetIDs || [])
                          .map(assetId => assets.find(a => a.id.toString() === assetId.toString()))
                          .filter(asset => asset);

                        const reportData = {
                          complianceID: compliance.complianceID,
                          title: compliance.title,
                          description: compliance.description,
                          regulatoryBody: compliance.regulatoryBody,
                          effectiveDate: compliance.effectiveDate,
                          reviewFrequency: compliance.reviewFrequency,
                          criticality: compliance.criticality || 'Medium',
                          status: compliance.status || 'Active',
                          requirements: (compliance.requirements || []).join('; '),
                          evidence: (compliance.evidence || []).join('; '),
                          linkedAssetsCount: linkedAssets.length,
                          linkedAssets: linkedAssets.map(asset => ({
                            id: asset.id,
                            name: asset.name,
                            type: asset.type,
                            owner: asset.owner,
                            description: asset.description,
                            complianceCriticality: asset.complianceCriticality || 'Low'
                          }))
                        };

                        // Create Excel workbook
                        const wb = XLSX.utils.book_new();
                        
                        // Summary sheet
                        const summaryData = [
                          { Field: 'Compliance ID', Value: reportData.complianceID },
                          { Field: 'Title', Value: reportData.title },
                          { Field: 'Description', Value: reportData.description },
                          { Field: 'Regulatory Body', Value: reportData.regulatoryBody },
                          { Field: 'Effective Date', Value: reportData.effectiveDate },
                          { Field: 'Review Frequency', Value: reportData.reviewFrequency },
                          { Field: 'Criticality', Value: reportData.criticality },
                          { Field: 'Status', Value: reportData.status },
                          { Field: 'Linked Assets Count', Value: reportData.linkedAssetsCount }
                        ];
                        const summaryWs = XLSX.utils.json_to_sheet(summaryData);
                        XLSX.utils.book_append_sheet(wb, summaryWs, "Summary");
                        
                        // Linked assets sheet
                        if (reportData.linkedAssets.length > 0) {
                          const assetsWs = XLSX.utils.json_to_sheet(reportData.linkedAssets);
                          XLSX.utils.book_append_sheet(wb, assetsWs, "Linked Assets");
                        }
                        
                        // Download
                        const timestamp = new Date().toISOString().slice(0, 10);
                        const filename = `compliance-${compliance.complianceID}-report-${timestamp}.xlsx`;
                        XLSX.writeFile(wb, filename);
                        
                        alert(`Report generated: ${filename}`);
                      }}
                      className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                    >
                      Generate Report
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      /**********************************************************************
       * Asset Import Form Modal - For manually adding new assets
       **********************************************************************/
      const AssetImportFormModal = ({ onClose, onAssetAdd, assets = [] }) => {
        const [formData, setFormData] = React.useState({
          name: '',
          type: 'Dataset',
          businessArea: '',
          description: '',
          owner: '',
          ownerEmail: '',
          tags: '',
          classification: 'Internal',
          complianceCriticality: 'Medium',
          endorsed: false
        });
        const [errors, setErrors] = React.useState({});
        const [isSubmitting, setIsSubmitting] = React.useState(false);

        const assetTypes = ['Dataset', 'Dashboard', 'Report', 'Data Procedures'];
        const businessAreas = [...new Set(assets.map(a => a.businessArea).filter(Boolean))];
        const classifications = ['Internal', 'Confidential', 'Highly Confidential'];
        const criticalities = ['Low', 'Medium', 'High'];

        const validateForm = () => {
          const newErrors = {};
          if (!formData.name.trim()) newErrors.name = 'Name is required';
          if (!formData.businessArea.trim()) newErrors.businessArea = 'Business Area is required';
          if (!formData.description.trim()) newErrors.description = 'Description is required';
          if (!formData.owner.trim()) newErrors.owner = 'Owner is required';
          if (!formData.ownerEmail.trim()) {
            newErrors.ownerEmail = 'Owner email is required';
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.ownerEmail)) {
            newErrors.ownerEmail = 'Please enter a valid email address';
          }
          return newErrors;
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          const validationErrors = validateForm();
          if (Object.keys(validationErrors).length > 0) {
            setErrors(validationErrors);
            return;
          }

          setIsSubmitting(true);
          try {
            const newAsset = {
              id: Math.max(...assets.map(a => a.id), 0) + 1,
              name: formData.name.trim(),
              type: formData.type,
              businessArea: formData.businessArea.trim(),
              description: formData.description.trim(),
              owner: formData.owner.trim(),
              ownerEmail: formData.ownerEmail.trim(),
              lastUpdated: new Date().toISOString().split('T')[0],
              tags: formData.tags.split(',').map(tag => tag.trim()).filter(Boolean),
              kpis: [],
              endorsed: formData.endorsed,
              classification: formData.classification,
              classificationTags: [],
              classificationJustification: `New asset: ${formData.name}`,
              complianceIDs: [],
              complianceCriticality: formData.complianceCriticality,
              additionalInfo: {
                assetID: `AST${String(Math.max(...assets.map(a => a.id), 0) + 1).padStart(4, '0')}`,
                domain: formData.businessArea,
                stewardID: 'manual-import',
                originalType: 'Manual Entry',
                attributeCount: '0'
              },
              schemaColumns: [],
              components: [],
              linkedAssets: []
            };

            await onAssetAdd(newAsset);
            onClose();
          } catch (error) {
            console.error('Error adding asset:', error);
          } finally {
            setIsSubmitting(false);
          }
        };

        const handleInputChange = (field, value) => {
          setFormData(prev => ({ ...prev, [field]: value }));
          if (errors[field]) {
            setErrors(prev => ({ ...prev, [field]: '' }));
          }
        };

        return (
          <div className="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" onClick={(e) => e.target === e.currentTarget && onClose()}>
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden">
              {/* Header */}
              <div className="bg-gradient-to-r from-green-600 to-green-700 px-6 py-4 text-white">
                <div className="flex items-center justify-between">
                  <div className="flex items-center">
                    <div className="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center mr-3">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>
                      </svg>
                    </div>
                    <div>
                      <h2 className="text-xl font-bold">Add New Asset</h2>
                      <p className="text-green-100 text-sm">Create a new data asset manually</p>
                    </div>
                  </div>
                  <button 
                    onClick={onClose}
                    className="w-8 h-8 flex items-center justify-center rounded-lg bg-white bg-opacity-20 hover:bg-opacity-30 transition-colors"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                  </button>
                </div>
              </div>

              {/* Form Content */}
              <div className="overflow-y-auto max-h-[calc(90vh-100px)]">
                <form onSubmit={handleSubmit} className="p-6 space-y-6">
                  {/* Basic Information */}
                  <div className="space-y-4">
                    <h3 className="text-lg font-semibold text-gray-900 border-b pb-2">Basic Information</h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Asset Name *</label>
                        <input
                          type="text"
                          value={formData.name}
                          onChange={(e) => handleInputChange('name', e.target.value)}
                          className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 ${errors.name ? 'border-red-500' : 'border-gray-300'}`}
                          placeholder="Enter asset name"
                          required
                        />
                        {errors.name && <p className="text-red-500 text-xs mt-1">{errors.name}</p>}
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Asset Type *</label>
                        <select
                          value={formData.type}
                          onChange={(e) => handleInputChange('type', e.target.value)}
                          className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                          required
                        >
                          {assetTypes.map(type => (
                            <option key={type} value={type}>{type}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Business Area *</label>
                        <input
                          type="text"
                          value={formData.businessArea}
                          onChange={(e) => handleInputChange('businessArea', e.target.value)}
                          className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 ${errors.businessArea ? 'border-red-500' : 'border-gray-300'}`}
                          placeholder="e.g., Operations, Finance, HR"
                          list="businessAreas"
                          required
                        />
                        <datalist id="businessAreas">
                          {businessAreas.map(area => (
                            <option key={area} value={area} />
                          ))}
                        </datalist>
                        {errors.businessArea && <p className="text-red-500 text-xs mt-1">{errors.businessArea}</p>}
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Classification *</label>
                        <select
                          value={formData.classification}
                          onChange={(e) => handleInputChange('classification', e.target.value)}
                          className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                          required
                        >
                          {classifications.map(classification => (
                            <option key={classification} value={classification}>{classification}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                      <textarea
                        value={formData.description}
                        onChange={(e) => handleInputChange('description', e.target.value)}
                        className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 ${errors.description ? 'border-red-500' : 'border-gray-300'}`}
                        placeholder="Describe the asset's purpose and content"
                        rows="3"
                        required
                      />
                      {errors.description && <p className="text-red-500 text-xs mt-1">{errors.description}</p>}
                    </div>
                  </div>

                  {/* Ownership Information */}
                  <div className="space-y-4">
                    <h3 className="text-lg font-semibold text-gray-900 border-b pb-2">Ownership Information</h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Owner Name *</label>
                        <input
                          type="text"
                          value={formData.owner}
                          onChange={(e) => handleInputChange('owner', e.target.value)}
                          className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 ${errors.owner ? 'border-red-500' : 'border-gray-300'}`}
                          placeholder="Enter owner's full name"
                          required
                        />
                        {errors.owner && <p className="text-red-500 text-xs mt-1">{errors.owner}</p>}
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Owner Email *</label>
                        <input
                          type="email"
                          value={formData.ownerEmail}
                          onChange={(e) => handleInputChange('ownerEmail', e.target.value)}
                          className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 ${errors.ownerEmail ? 'border-red-500' : 'border-gray-300'}`}
                          placeholder="owner@company.com"
                          required
                        />
                        {errors.ownerEmail && <p className="text-red-500 text-xs mt-1">{errors.ownerEmail}</p>}
                      </div>
                    </div>
                  </div>

                  {/* Additional Details */}
                  <div className="space-y-4">
                    <h3 className="text-lg font-semibold text-gray-900 border-b pb-2">Additional Details</h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Tags</label>
                        <input
                          type="text"
                          value={formData.tags}
                          onChange={(e) => handleInputChange('tags', e.target.value)}
                          className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                          placeholder="e.g., critical, analytics, customer-data (comma-separated)"
                        />
                        <p className="text-xs text-gray-500 mt-1">Separate multiple tags with commas</p>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Compliance Criticality</label>
                        <select
                          value={formData.complianceCriticality}
                          onChange={(e) => handleInputChange('complianceCriticality', e.target.value)}
                          className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                        >
                          {criticalities.map(criticality => (
                            <option key={criticality} value={criticality}>{criticality}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="flex items-center">
                      <input
                        type="checkbox"
                        id="endorsed"
                        checked={formData.endorsed}
                        onChange={(e) => handleInputChange('endorsed', e.target.checked)}
                        className="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500"
                      />
                      <label htmlFor="endorsed" className="ml-2 text-sm text-gray-700">
                        Mark this asset as endorsed
                      </label>
                    </div>
                  </div>

                  {/* Form Actions */}
                  <div className="flex justify-end space-x-3 pt-6 border-t">
                    <button
                      type="button"
                      onClick={onClose}
                      className="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                    >
                      {isSubmitting ? 'Adding Asset...' : 'Add Asset'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        );
      };

      /**********************************************************************
       * Compliance Import Form Modal - For manually adding new compliance requirements
       **********************************************************************/
      const ComplianceImportFormModal = ({ onClose, onComplianceAdd, assets = [], existingCompliances = {} }) => {
        const [formData, setFormData] = React.useState({
          complianceID: '',
          title: '',
          name: '',
          effectiveDate: '',
          description: '',
          regulatoryBody: '',
          reviewFrequency: 'Annually',
          status: 'Active',
          criticality: 'Medium',
          category: 'Regulatory Compliance',
          linkedAssetIDs: []
        });
        const [errors, setErrors] = React.useState({});
        const [isSubmitting, setIsSubmitting] = React.useState(false);

        const statusOptions = ['Active', 'Inactive', 'Pending', 'Under Review', 'Expired'];
        const criticalityOptions = ['Low', 'Medium', 'High'];
        const reviewFrequencyOptions = ['Annually', 'Every 2 years', 'Every 5 years', 'Continuous', 'As required', 'Monthly', 'Quarterly'];
        const categoryOptions = ['Regulatory Compliance', 'Data Security', 'Operational', 'Financial', 'Environmental', 'Health & Safety'];

        const validateForm = () => {
          const newErrors = {};
          
          if (!formData.complianceID.trim()) {
            newErrors.complianceID = 'Compliance ID is required';
          } else if (existingCompliances[formData.complianceID]) {
            newErrors.complianceID = 'Compliance ID already exists';
          } else if (!/^CRQ\d{4,}$/.test(formData.complianceID)) {
            newErrors.complianceID = 'Compliance ID must be in format CRQ#### (e.g., CRQ0001)';
          }
          
          if (!formData.title.trim()) newErrors.title = 'Title is required';
          if (!formData.name.trim()) newErrors.name = 'Name is required';
          if (formData.effectiveDate && !Date.parse(formData.effectiveDate)) {
            newErrors.effectiveDate = 'Please enter a valid date';
          }
          
          return newErrors;
        };

          e.preventDefault();
          const validationErrors = validateForm();
          if (Object.keys(validationErrors).length > 0) {
            setErrors(validationErrors);
            return;
          }

          setIsSubmitting(true);
          try {
            const newCompliance = {
              complianceID: formData.complianceID.trim(),
              title: formData.title.trim(),
              name: formData.name.trim(),
              effectiveDate: formData.effectiveDate || null,
              description: formData.description.trim() || null,
              regulatoryBody: formData.regulatoryBody.trim() || null,
              reviewFrequency: formData.reviewFrequency || null,
              status: formData.status,
              criticality: formData.criticality,
              category: formData.category,
              linkedAssetIDs: formData.linkedAssetIDs
            };

            await onComplianceAdd(newCompliance);
            onClose();

      /**********************************************************************
       * Toast Notification Component – For user feedback
       **********************************************************************/
      const ToastProvider = ({ children }) => {
        const [toasts, setToasts] = React.useState([]);
        
        const addToast = React.useCallback((message, type = 'info', duration = 5000) => {
          const id = Date.now() + Math.random();
          const toast = { id, message, type, duration };
          setToasts(prev => [...prev, toast]);
          
          if (duration > 0) {
            setTimeout(() => {
              setToasts(prev => prev.filter(t => t.id !== id));
            }, duration);
          }
        }, []);
        
        const removeToast = React.useCallback((id) => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, []);
        
        const toastContext = React.useMemo(() => ({ addToast, removeToast }), [addToast, removeToast]);
        
        return (
          <ToastContext.Provider value={toastContext}>
            {children}
            <div className="fixed top-4 right-4 z-50 space-y-2">
              {toasts.map(toast => (
                <div
                  key={toast.id}
                  className={`max-w-sm w-full bg-white shadow-lg rounded-lg pointer-events-auto ring-1 ring-black ring-opacity-5 transform transition-all duration-300 ${
                    toast.type === 'success' ? 'border-l-4 border-green-500' :
                    toast.type === 'error' ? 'border-l-4 border-red-500' :
                    toast.type === 'warning' ? 'border-l-4 border-yellow-500' :
                    'border-l-4 border-blue-500'
                  }`}
                >
                  <div className="p-4">
                    <div className="flex items-start">
                      <div className="flex-shrink-0">
                        {toast.type === 'success' && (
                          <svg className="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                        )}
                        {toast.type === 'error' && (
                          <svg className="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                        )}
                        {toast.type === 'warning' && (
                          <svg className="h-5 w-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.962-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
                          </svg>
                        )}
                        {toast.type === 'info' && (
                          <svg className="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                        )}
                      </div>
                      <div className="ml-3 w-0 flex-1">
                        <p className="text-sm font-medium text-gray-900">{toast.message}</p>
                      </div>
                      <div className="ml-4 flex-shrink-0 flex">

                          onClick={() => removeToast(toast.id)}

                          </svg>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </ToastContext.Provider>
        );

      /**********************************************************************
       * Enhanced ErrorBoundary Component – React Error Boundary with better UX.
       **********************************************************************/
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null, errorInfo: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true };
        }
        componentDidCatch(error, errorInfo) {
          console.error('ErrorBoundary caught an error', error, errorInfo);
          this.setState({
            error: error,
            errorInfo: errorInfo
          });
        }
        render() {
          if (this.state.hasError) {
            return React.createElement(
              'div',
              { className: 'min-h-screen flex items-center justify-center bg-gray-50' },
              React.createElement(
                'div',
                { className: 'max-w-md w-full bg-white shadow-lg rounded-lg p-6 text-center' },

                  { className: 'mb-4' },

                    })

                ),
                React.createElement('h2', { className: 'text-lg font-semibold text-gray-900 mb-2' }, 'Something went wrong'),
                React.createElement('p', { className: 'text-gray-600 mb-4' }, 'The application encountered an unexpected error. Please refresh the page to try again.'),
                React.createElement(
                  'button',
                  {
                    onClick: () => window.location.reload(),

                  },
                  'Refresh Page'
                )
              )
            );
          }
          return this.props.children;
        }
      }

      const CRITICAL_ELEMENTS = ["customer_id", "email_address", "account_status"];

      const SchemaRowDetails = ({ column, isCritical }) => (
        <tr className="bg-gray-50">

      /**********************************************************************

      /**********************************************************************
       * Additional Icons for LineageFlow Component
       **********************************************************************/
      const ArrowRight = (props) => <Icon name="arrow-right" {...props} />;
      const DatabaseIcon = (props) => <Icon name="database" {...props} />;
      const BoxIcon = (props) => <Icon name="box" {...props} />;
      const GitBranch = (props) => <Icon name="git-branch" {...props} />;
      const BarChartFlowIcon = (props) => <Icon name="bar-chart" {...props} />;
      const Cog = (props) => <Icon name="cog" {...props} />;

      /**********************************************************************
       * LineageFlow Component – For displaying lineage flows.
       **********************************************************************/
      const LineageFlow = ({ flowData }) => {
        const [expandedNodes, setExpandedNodes] = React.useState(new Set());
        const getNodeStyles = (type) => {
          switch (type) {
            case 'source':
              return 'bg-blue-50 border-blue-200 hover:border-blue-300';
            case 'transform':

            case 'derived':

            case 'output':
              return 'bg-orange-50 border-orange-200 hover:border-orange-300';
            default:
              return 'bg-gray-50 border-gray-200 hover:border-gray-300';
          }
        };
        const getNodeIcon = (type) => {
          switch (type) {
            case 'source':
              return <DatabaseIcon className="w-5 h-5 text-blue-600" />;
            case 'transform':
              return <Cog className="w-5 h-5 text-purple-600" />;
            case 'derived':
              return <GitBranch className="w-5 h-5 text-green-600" />;
            case 'output':
              return <BarChartFlowIcon className="w-5 h-5 text-orange-600" />;

        };
        const toggleNode = (id) => {
          const newExpanded = new Set(expandedNodes);
          newExpanded.has(id) ? newExpanded.delete(id) : newExpanded.add(id);
          setExpandedNodes(newExpanded);
        };
        const flows = (flowData && Object.keys(flowData).length > 0) ? flowData : {
          salesAnalytics: [
            {
              id: 1,
              name: 'CRM Data',
              type: 'source',

              details: ['Daily updates', 'Customer interactions', 'Sales records']
            },
            {
              id: 2,
              name: 'Data Cleaning',
              type: 'transform',
              description: 'Standardize and deduplicate',
              details: ['Remove duplicates', 'Format standardization', 'Field validation']
            },
            {
              id: 3,
              name: 'Enriched Data',
              type: 'derived',
              description: 'Enhanced customer profiles',
              details: ['Merged demographics', 'Behavior scores', 'Segmentation']
            },

        return (
          <div className="space-y-8">
            {Object.entries(flows).map(([flowKey, flowNodes]) => (

                  {flowKey.charAt(0).toUpperCase() + flowKey.slice(1).replace(/([A-Z])/g, ' $1')}
                </h3>
                <div className="flex items-start space-x-4 overflow-x-auto pb-4">
                  {flowNodes.map((node, index) => (
                    <React.Fragment key={node.id}>
                      <div className="flex flex-col min-w-[220px]">
                        <div className={`border-2 rounded-lg p-4 transition-all duration-200 cursor-pointer ${getNodeStyles(node.type)}`} onClick={() => toggleNode(node.id)}>
                          <div className="flex items-center space-x-2 mb-2">
                            {getNodeIcon(node.type)}
                            <span className="font-medium text-sm">{node.name}</span>
                          </div>
                          <p className="text-sm text-gray-600">{node.description}</p>
                          {expandedNodes.has(node.id) && (
                            <div className="mt-3 pt-3 border-t border-gray-200">
                              <ul className="text-sm space-y-1">
                                {node.details.map((detail, i) => (
                                  <li key={i} className="text-gray-600">• {detail}</li>
                                ))}

                            </div>
                          )}
                        </div>
                      </div>
                      {index < flowNodes.length - 1 && (
                        <div className="flex items-center pt-8">
                          <ArrowRight className="w-6 h-6 text-gray-400" />

      /**********************************************************************
       * Custom Hook: useDebounce
       **********************************************************************/
      function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = React.useState(value);
        React.useEffect(() => {
          const handler = setTimeout(() => setDebouncedValue(value), delay);
          return () => clearTimeout(handler);
        }, [value, delay]);
        return debouncedValue;
      }

      /**********************************************************************
       * Helper Functions: Icon retrieval for asset and KPI types.
       **********************************************************************/
      const getAssetIcon = (type) => {
        switch (type) {
          case "Dataset": return <DatasetIcon className="w-5 h-5" />;
          case "Dashboard": return <DashboardIcon className="w-5 h-5" />;
          case "Report": return <ReportIcon className="w-5 h-5" />;
          case "Data Procedures": return <DataProceduresIcon className="w-5 h-5" />;
          default: return null;
        }
      };

      const getKpiIcon = (type) => {
        switch (type) {
          case "trendingUp":
            return <TrendingUpIcon className="w-5 h-5" />;
          case "dollarSign":
            return <DollarSignIcon className="w-5 h-5" />;

            return <DashboardIcon className="w-5 h-5" />;

            return <UserIcon className="w-5 h-5" />;
          case "reporting":
            return <ReportingIcon className="w-5 h-5" />;
          case "governance":
            return <ComplianceIcon className="w-5 h-5" />;
          case "fireRisk":
            return <FireRiskIcon className="w-5 h-5" />;

          default:
            return null;
        }
      };

      /**********************************************************************
       * Asset Upload Component – Supports Excel and JSON imports.
       **********************************************************************/
      const AssetUpload = ({ onUpload }) => {
        const handleFileChange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          // Validate file size (max 10MB)
          const maxSize = 10 * 1024 * 1024;
          if (file.size > maxSize) {
            alert("File size exceeds 10MB limit. Please choose a smaller file.");
            e.target.value = '';
            return;
          }
          
          const fileName = file.name.toLowerCase();
          if (fileName.endsWith(".json")) {
            const reader = new FileReader();
            reader.onload = function(evt) {
              try {
                const importedData = JSON.parse(evt.target.result);
                let assetsToImport = [];
                
                // Handle different JSON structures
                if (Array.isArray(importedData)) {
                  assetsToImport = importedData;
                } else if (importedData.assets && Array.isArray(importedData.assets)) {
                  // Handle export format with metadata
                  assetsToImport = importedData.assets;
                } else if (typeof importedData === 'object' && importedData.name) {
                  // Single asset object
                  assetsToImport = [importedData];
                } else {
                  alert("Invalid JSON format. Expected an array of assets or an object with an 'assets' array.");
                  return;
                }
                
                if (assetsToImport.length === 0) {
                  alert("No assets found in the JSON file.");
                  return;
                }
                
                // Process each asset
                assetsToImport.forEach((asset, index) => {
                  // Generate ID if missing
                  if (!asset.id) {
                    const maxId = Math.max(...document.querySelectorAll('[data-testid="asset-card"]').length ? 
                      Array.from(document.querySelectorAll('[data-testid="asset-card"]')).map(el => parseInt(el.dataset.id || 0)) : [0]);
                    asset.id = maxId + index + 1;
                  }
                  
                  // Ensure required fields have defaults
                  asset.tags = asset.tags || [];
                  asset.kpis = asset.kpis || [];
                  asset.classification = asset.classification || "Internal";
                  asset.classificationTags = asset.classificationTags || [];
                  asset.complianceIDs = asset.complianceIDs || [];
                  asset.schemaColumns = asset.schemaColumns || [];
                  asset.components = asset.components || [];
                  asset.linkedAssets = asset.linkedAssets || [];
                  asset.additionalInfo = asset.additionalInfo || {};
                  
                  onUpload(asset);
                });
                
                alert(`JSON file imported successfully! Added ${assetsToImport.length} asset(s) to the catalogue.`);
              } catch (error) {
                console.error("JSON import error:", error);
                alert(`Error parsing JSON file: ${error.message}\n\nPlease ensure your JSON file is valid and contains asset data.`);
              }
            };
            reader.readAsText(file);
          } else if (fileName.endsWith(".xlsx") || fileName.endsWith(".xls")) {
            const reader = new FileReader();
            reader.onload = function(evt) {
              try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: "array" });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const importedData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                importedData.forEach((asset, index) => {
                  // Generate unique ID
                  const maxId = Math.max(...document.querySelectorAll('[data-testid="asset-card"]').length ? 
                    Array.from(document.querySelectorAll('[data-testid="asset-card"]')).map(el => parseInt(el.dataset.id || 0)) : [0]);
                  asset.id = maxId + index + 1;
                  
                  // Parse tags from string to array
                  if (typeof asset.tags === 'string') {
                    asset.tags = asset.tags.split(',').map(tag => tag.trim()).filter(Boolean);
                  } else {
                    asset.tags = asset.tags || [];
                  }
                  
                  // Parse complianceIDs from string to array
                  if (typeof asset.complianceIDs === 'string') {
                    asset.complianceIDs = asset.complianceIDs.split(',').map(id => id.trim()).filter(Boolean);
                  } else {
                    asset.complianceIDs = asset.complianceIDs || [];
                  }
                  
                  // Handle endorsed field (convert Yes/No to boolean)
                  if (typeof asset.endorsed === 'string') {
                    asset.endorsed = asset.endorsed.toLowerCase() === 'yes' || asset.endorsed.toLowerCase() === 'true';
                  } else {
                    asset.endorsed = Boolean(asset.endorsed);
                  }
                  
                  // Set defaults for required fields
                  asset.classification = asset.classification || "Internal";
                  asset.classificationTags = asset.classificationTags || [];
                  asset.classificationJustification = asset.classificationJustification || "";
                  asset.complianceCriticality = asset.complianceCriticality || "Medium";
                  
                  // Build additionalInfo object from flat fields
                  asset.additionalInfo = {
                    assetID: asset.assetID || '',
                    domain: asset.domain || '',
                    stewardID: asset.stewardID || '',
                    originalType: asset.originalType || '',
                    attributeCount: asset.attributeCount || ''
                  };
                  
                  // Parse KPIs from string format
                  asset.kpis = [];
                  if (asset.kpiMetrics) {
                    const kpiPairs = asset.kpiMetrics.split(';');
                    kpiPairs.forEach(pair => {
                      const [metric, value] = pair.split(':').map(s => s.trim());
                      if (metric && value) {
                        asset.kpis.push({
                          metric: metric,
                          value: value,
                          type: metric.toLowerCase().includes('uptime') ? 'trendingUp' : 'barChart'
                        });
                      }
                    });
                  }
                  
                  // Parse schema columns from string format
                  asset.schemaColumns = [];
                  if (asset.schemaColumns && typeof asset.schemaColumns === 'string') {
                    const columns = asset.schemaColumns.split(';');
                    columns.forEach(col => {
                      const match = col.trim().match(/^(\w+)\s*\(([^)]+)\)/);
                      if (match) {
                        asset.schemaColumns.push({
                          name: match[1],
                          type: match[2],
                          isPrimaryKey: match[1].toLowerCase().includes('id'),
                          nullable: true,
                          unique: match[1].toLowerCase().includes('id'),
                          description: `${match[1]} field`,
                          format: match[2],
                          examples: 'Sample value',
                          businessRules: `Business rules for ${match[1]}`,
                          sensitivity: 'medium'
                        });
                      }
                    });
                  }
                  
                  // Parse components from string format
                  asset.components = [];
                  if (asset.components && typeof asset.components === 'string') {
                    const compList = asset.components.split(';');
                    compList.forEach(comp => {
                      if (comp.trim()) {
                        asset.components.push({
                          title: comp.trim(),
                          description: `${comp.trim()} component`
                        });
                      }
                    });
                  }
                  
                  // Parse linked assets from string format
                  asset.linkedAssets = [];
                  if (asset.linkedAssets && typeof asset.linkedAssets === 'string') {
                    const linkedList = asset.linkedAssets.split(';');
                    linkedList.forEach((linked, idx) => {
                      if (linked.trim()) {
                        asset.linkedAssets.push({
                          id: maxId + 100 + idx, // Temporary ID for linked assets
                          name: linked.trim(),
                          type: 'Dataset',
                          description: `${linked.trim()} - Related asset`
                        });
                      }
                    });
                  }
                  
                  // Clean up temporary flat fields
                  delete asset.assetID;
                  delete asset.domain;
                  delete asset.stewardID;
                  delete asset.originalType;
                  delete asset.attributeCount;
                  delete asset.kpiMetrics;
                  delete asset.schemaColumnCount;
                  delete asset.componentCount;
                  delete asset.linkedAssetCount;
                  
                  onUpload(asset);
                });
                alert(`Excel file imported successfully! Added ${importedData.length} asset(s) to the catalogue.`);
              } catch (error) {
                console.error("Excel import error:", error);
                alert(`Error parsing Excel file: ${error.message}\n\nPlease ensure your file follows the template format. Download the template if you need a reference.`);
              }
            };
            reader.readAsArrayBuffer(file);
          } else {
            alert("Unsupported file type. Please upload a .json or .xlsx file.");
          }
        };
        return (
          <div className="space-y-4">
            <div className="flex flex-col sm:flex-row gap-3">
              <button 
                onClick={() => {
                  // Create and download a comprehensive sample template
                  const sampleData = [{
                    name: 'Sample Customer Data Asset',
                    type: 'Dataset',
                    businessArea: 'Operations',
                    description: 'Sample customer data management system containing customer profiles, transaction history, and analytics',
                    owner: 'John Smith',
                    ownerEmail: 'john.smith@company.com',
                    lastUpdated: '2024-01-15',
                    tags: 'customer,analytics,core-system,GDPR',
                    classification: 'Confidential',
                    classificationJustification: 'Contains PII and sensitive customer data',
                    complianceCriticality: 'High',
                    complianceIDs: 'CRQ0001,CRQ0002',
                    endorsed: 'Yes',
                    domain: 'Customer Management',
                    assetID: 'AST0001',
                    stewardID: 'STEW001',
                    originalType: 'Database',
                    attributeCount: '25',
                    kpiMetrics: 'Data Quality: 95%; Uptime: 99.5%',
                    schemaColumnCount: '8',
                    schemaColumns: 'customer_id (varchar); email (varchar); phone (varchar); address (text); created_date (datetime); status (varchar); risk_score (decimal); last_login (datetime)',
                    componentCount: '3',
                    components: 'Customer Profile; Transaction History; Analytics Dashboard',
                    linkedAssetCount: '2',
                    linkedAssets: 'Customer Analytics Dashboard; Transaction Processing System'
                  }];
                  const ws = XLSX.utils.json_to_sheet(sampleData);
                  const wb = XLSX.utils.book_new();
                  XLSX.utils.book_append_sheet(wb, ws, 'AssetTemplate');
                  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                  const blob = new Blob([wbout], { type: 'application/octet-stream' });
                  const url = URL.createObjectURL(blob);
                  const link = document.createElement('a');
                  link.href = url;
                  link.download = 'AssetTemplate.xlsx';
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  URL.revokeObjectURL(url);
                }}
                className="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
              >
                <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Download Template
              </button>
              <div className="relative">
                <input 
                  type="file" 
                  accept=".xlsx, .xls, .json" 
                  onChange={handleFileChange}
                  className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                />
                <div className="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors cursor-pointer">
                  <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/>
                  </svg>
                  Choose File to Import
                </div>
              </div>
            </div>
            <div className="bg-blue-50 border border-blue-200 rounded-md p-3">
              <p className="text-xs text-blue-800">
                <strong>Supported formats:</strong> Excel (.xlsx, .xls) and JSON files<br/>
                <strong>Template fields:</strong> id, name, type, businessArea, description, owner, ownerEmail, lastUpdated, tags, kpis, endorsed, classification
              </p>
            </div>
          </div>
        );
      };

      /**********************************************************************
       * Asset Export Component – Exports current assets as JSON or Excel.
       **********************************************************************/
      const AssetExport = ({ assets }) => {
        const handleExportJSON = () => {
          // Create comprehensive export with all data fields
          const exportData = {
            exportDate: new Date().toISOString(),
            totalAssets: assets.length,
            assets: assets.map(asset => ({
              ...asset,
              // Ensure all arrays and objects are properly included
              tags: asset.tags || [],
              kpis: asset.kpis || [],
              classificationTags: asset.classificationTags || [],
              complianceIDs: asset.complianceIDs || [],
              schemaColumns: asset.schemaColumns || [],
              components: asset.components || [],
              linkedAssets: asset.linkedAssets || [],
              // Ensure nested objects are included
              additionalInfo: asset.additionalInfo || {}
            }))
          };
          
          const dataStr = JSON.stringify(exportData, null, 2);
          const blob = new Blob([dataStr], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "exported_assets.json";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };
        
        const handleExportExcel = () => {
          // Flatten assets for Excel with all data fields properly represented
          const flattenedAssets = assets.map(asset => ({
            // Basic fields
            id: asset.id,
            name: asset.name,
            type: asset.type,
            businessArea: asset.businessArea,
            description: asset.description,
            owner: asset.owner,
            ownerEmail: asset.ownerEmail,
            lastUpdated: asset.lastUpdated,
            endorsed: asset.endorsed ? 'Yes' : 'No',
            classification: asset.classification,
            classificationJustification: asset.classificationJustification,
            complianceCriticality: asset.complianceCriticality,
            
            // Array fields converted to strings
            tags: (asset.tags || []).join(', '),
            classificationTags: (asset.classificationTags || []).join(', '),
            complianceIDs: (asset.complianceIDs || []).join(', '),
            
            // KPIs flattened
            kpiMetrics: (asset.kpis || []).map(kpi => `${kpi.metric}: ${kpi.value}`).join('; '),
            
            // Additional info flattened
            assetID: asset.additionalInfo?.assetID || '',
            domain: asset.additionalInfo?.domain || '',
            stewardID: asset.additionalInfo?.stewardID || '',
            originalType: asset.additionalInfo?.originalType || '',
            attributeCount: asset.additionalInfo?.attributeCount || '',
            
            // Schema summary
            schemaColumnCount: (asset.schemaColumns || []).length,
            schemaColumns: (asset.schemaColumns || []).map(col => 
              `${col.name} (${col.type})`
            ).join('; '),
            
            // Components summary
            componentCount: (asset.components || []).length,
            components: (asset.components || []).map(comp => comp.title).join('; '),
            
            // Linked assets summary
            linkedAssetCount: (asset.linkedAssets || []).length,
            linkedAssets: (asset.linkedAssets || []).map(linked => linked.name).join('; ')
          }));
          
          // Create workbook with multiple sheets
          const wb = XLSX.utils.book_new();
          
          // Main assets sheet
          const ws = XLSX.utils.json_to_sheet(flattenedAssets);
          XLSX.utils.book_append_sheet(wb, ws, "Assets");
          
          // Schema details sheet (if any assets have schema)
          const schemaData = [];
          assets.forEach(asset => {
            if (asset.schemaColumns && asset.schemaColumns.length > 0) {
              asset.schemaColumns.forEach(col => {
                schemaData.push({
                  assetId: asset.id,
                  assetName: asset.name,
                  columnName: col.name,
                  columnType: col.type,
                  isPrimaryKey: col.isPrimaryKey ? 'Yes' : 'No',
                  nullable: col.nullable ? 'Yes' : 'No',
                  unique: col.unique ? 'Yes' : 'No',
                  description: col.description || '',
                  format: col.format || '',
                  examples: col.examples || '',
                  businessRules: col.businessRules || '',
                  sensitivity: col.sensitivity || ''
                });
              });
            }
          });
          
          if (schemaData.length > 0) {
            const schemaWs = XLSX.utils.json_to_sheet(schemaData);
            XLSX.utils.book_append_sheet(wb, schemaWs, "Schema Details");
          }
          
          // Compliance summary sheet
          const complianceData = [];
          assets.forEach(asset => {
            if (asset.complianceIDs && asset.complianceIDs.length > 0) {
              asset.complianceIDs.forEach(compId => {
                complianceData.push({
                  assetId: asset.id,
                  assetName: asset.name,
                  complianceID: compId,
                  criticality: asset.complianceCriticality
                });
              });
            }
          });
          
          if (complianceData.length > 0) {
            const complianceWs = XLSX.utils.json_to_sheet(complianceData);
            XLSX.utils.book_append_sheet(wb, complianceWs, "Compliance Links");
          }
          
          const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
          const blob = new Blob([wbout], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "exported_assets.xlsx";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };
        return (
          <div className="space-y-4">
            <div className="flex flex-col sm:flex-row gap-3">
              <button 
                onClick={handleExportJSON}
                className="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm bg-blue-600 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
              >
                <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Export as JSON
              </button>
              <button 
                onClick={handleExportExcel}
                className="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm bg-green-600 text-sm font-medium text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors"
              >
                <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a4 4 0 01-4-4V5a4 4 0 014-4h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a4 4 0 01-4 4z"/>
                </svg>
                Export as Excel
              </button>
            </div>
            <div className="bg-green-50 border border-green-200 rounded-md p-3">
              <p className="text-xs text-green-800">
                <strong>Export includes:</strong> All {assets.length} assets with complete metadata, schema, and compliance information<br/>
                <strong>Formats:</strong> JSON for technical use, Excel for business analysis
              </p>
            </div>
          </div>
        );
      };

      /**********************************************************************
       * Glossary Component – Enhanced with search and add-term functionality.
       **********************************************************************/
      const Glossary = () => {
        const [glossaryData, setGlossaryData] = React.useState([
          { term: 'Dataset', definition: 'A structured collection of data.' },
          { term: 'Dashboard', definition: 'A UI that presents information.' },
          { term: 'Report', definition: 'A document with data analysis.' },
          { term: 'KPI', definition: 'Key Performance Indicator.' },
          { term: 'ETL', definition: 'Extract, Transform, Load process.' },
          { term: 'Analytics', definition: 'Interpretation of data patterns.' }
        ]);
        const [search, setSearch] = React.useState('');
        const [newTerm, setNewTerm] = React.useState({ term: '', definition: '' });
        const filteredGlossary = React.useMemo(() => {
          return glossaryData.filter(item =>
            item.term.toLowerCase().includes(search.toLowerCase()) ||
            item.definition.toLowerCase().includes(search.toLowerCase())
          );
        }, [search, glossaryData]);
        const addGlossaryTerm = () => {
          if (newTerm.term.trim() && newTerm.definition.trim()) {
            setGlossaryData([...glossaryData, newTerm]);
            setNewTerm({ term: '', definition: '' });
          }
        };
        return (
          <div className="p-6">
            <h2 className="text-3xl font-bold mb-4">Business Glossary</h2>
            <div className="mb-4">
              <input type="text" placeholder="Search terms..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            {filteredGlossary.length > 0 ? (
              <div className="space-y-4">
                {filteredGlossary.map((item, idx) => (
                  <div key={idx} className="p-4 border rounded bg-white shadow">
                    <h3 className="text-xl font-semibold">{item.term}</h3>
                    <p className="text-gray-700">{item.definition}</p>
                  </div>
                ))}
              </div>
            ) : (
              <p className="text-gray-500">No glossary terms found.</p>
            )}
            <div className="mt-6 border-t pt-4">
              <h3 className="text-xl font-semibold mb-2">Add a New Glossary Term</h3>
