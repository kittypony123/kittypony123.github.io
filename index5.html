      /**********************************************************************
       * LineageBuilder Component - Step-by-step lineage creation with visual flow
       **********************************************************************/
      const LineageBuilder = ({ 
        currentData, 
        onDataChange, 
        activeTab, 
        onTabChange, 
        assets,
        onCreateAsset 
      }) => {
        
        // Asset picker state
        const [showAssetPicker, setShowAssetPicker] = React.useState(false);
        const [assetPickerMode, setAssetPickerMode] = React.useState('source'); // 'source' or 'output'
        
        const updateData = (section, data) => {
          const updatedData = {
            ...currentData,
            [section]: data,
            metadata: {
              ...currentData.metadata,
              lastModified: new Date().toISOString()
            }
          };
          onDataChange(updatedData);
        };

        const addSource = () => {
          setAssetPickerMode('source');
          setShowAssetPicker(true);
        };

        const addManualSource = () => {
          const newSource = {
            id: Date.now(),
            name: '',
            type: 'table',
            description: '',
            location: '',
            isManual: true
          };
          updateData('sources', [...currentData.sources, newSource]);
        };

        const addOutput = () => {
          setAssetPickerMode('output');
          setShowAssetPicker(true);
        };

        const addManualOutput = () => {
          const newOutput = {
            id: Date.now(),
            name: '',
            type: 'table',
            description: '',
            location: '',
            isManual: true
          };
          updateData('outputs', [...currentData.outputs, newOutput]);
        };

        const removeSource = (id) => {
          updateData('sources', currentData.sources.filter(s => s.id !== id));
        };

        const removeOutput = (id) => {
          updateData('outputs', currentData.outputs.filter(o => o.id !== id));
        };

        const updateSource = (id, field, value) => {
          updateData('sources', currentData.sources.map(s => 
            s.id === id ? { ...s, [field]: value } : s
          ));
        };

        const updateOutput = (id, field, value) => {
          updateData('outputs', currentData.outputs.map(o => 
            o.id === id ? { ...o, [field]: value } : o
          ));
        };

        // Convert manual asset to catalog asset
        const convertManualAssetToCatalog = (asset, section) => {
          if (!asset.name.trim()) {
            alert('Please provide a name for the asset before saving to catalog');
            return;
          }

          const catalogAsset = {
            name: asset.name,
            type: asset.type,
            description: asset.description || '',
            owner: asset.owner || 'Unknown',
            businessArea: 'Data',
            tags: [],
            location: asset.location || ''
          };

          // Create asset in main catalog
          const newCatalogAsset = onCreateAsset(catalogAsset);
          
          // Update the lineage item to reference the catalog asset
          const updatedAsset = {
            ...asset,
            assetId: newCatalogAsset.id,
            isFromCatalog: true,
            location: `Catalog Asset: ${newCatalogAsset.name}`
          };

          // Update the section (sources or outputs)
          if (section === 'sources') {
            updateData('sources', currentData.sources.map(s => 
              s.id === asset.id ? updatedAsset : s
            ));
          } else if (section === 'outputs') {
            updateData('outputs', currentData.outputs.map(o => 
              o.id === asset.id ? updatedAsset : o
            ));
          }
          
          // If we're in a saved project, update the asset links immediately
          if (selectedLineageProject?.id) {
            // Use setTimeout to ensure the data update has been processed
            setTimeout(() => {
              const updatedProject = { ...selectedLineageProject, data: currentData };
              updateAssetLineageLinks(updatedProject);
            }, 100);
          }
        };

        // Asset picker handlers
        const handleAssetSelect = (asset) => {
          const assetItem = {
            id: Date.now(),
            name: asset.name,
            type: asset.type.toLowerCase(),
            description: asset.description || '',
            location: `Catalog Asset: ${asset.name}`,
            assetId: asset.id,
            isFromCatalog: true
          };

          if (assetPickerMode === 'source') {
            updateData('sources', [...currentData.sources, assetItem]);
          } else {
            updateData('outputs', [...currentData.outputs, assetItem]);
          }
        };

        const handleAssetCreate = (newAsset) => {
          // Add to main catalog
          onCreateAsset(newAsset);
          
          // Add to current lineage
          const assetItem = {
            id: Date.now(),
            name: newAsset.name,
            type: newAsset.type.toLowerCase(),
            description: newAsset.description || '',
            location: `New Asset: ${newAsset.name}`,
            assetId: newAsset.id,
            isFromCatalog: true,
            isNewlyCreated: true
          };

          if (assetPickerMode === 'source') {
            updateData('sources', [...currentData.sources, assetItem]);
          } else {
            updateData('outputs', [...currentData.outputs, assetItem]);
          }
        };

        const calculateProgress = () => {
          let completed = 0;
          const total = 5;
          
          if (currentData.general.projectName && currentData.general.businessPurpose) completed++;
          if (currentData.sources.length > 0) completed++;
          if (currentData.processing.method) completed++;
          if (currentData.intermediate.length > 0) completed++;
          if (currentData.outputs.length > 0) completed++;
          
          return Math.round((completed / total) * 100);
        };

        const progress = calculateProgress();

        return (
          <div className="space-y-6">
            {/* Progress Indicator */}
            <div className="bg-white rounded-lg shadow p-6">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-lg font-semibold text-gray-900">Lineage Progress</h3>
                <span className="text-sm font-medium text-blue-600">{progress}%</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-2">
                <div 
                  className="bg-blue-600 h-2 rounded-full transition-all duration-300" 
                  style={{ width: `${progress}%` }}
                ></div>
              </div>
              
              {/* Progress Steps */}
              <div className="grid grid-cols-5 gap-2 mt-6">
                {[
                  { key: 'general', icon: '📝', title: 'General', completed: currentData.general.projectName && currentData.general.businessPurpose },
                  { key: 'sources', icon: '📁', title: 'Sources', completed: currentData.sources.length > 0 },
                  { key: 'processing', icon: '⚙️', title: 'Process', completed: currentData.processing.method },
                  { key: 'intermediate', icon: '🔄', title: 'Integration', completed: currentData.intermediate.length > 0 },
                  { key: 'outputs', icon: '🎯', title: 'Outputs', completed: currentData.outputs.length > 0 }
                ].map((step, index) => (
                  <div 
                    key={step.key}
                    className={`text-center p-3 rounded-lg cursor-pointer transition-colors ${
                      activeTab === step.key 
                        ? 'bg-blue-100 border-2 border-blue-500' 
                        : step.completed 
                          ? 'bg-green-50 border border-green-200 hover:bg-green-100' 
                          : 'bg-gray-50 border border-gray-200 hover:bg-gray-100'
                    }`}
                    onClick={() => onTabChange(step.key)}
                  >
                    <div className={`text-2xl mb-1 ${step.completed ? 'opacity-100' : 'opacity-60'}`}>
                      {step.completed ? '✅' : step.icon}
                    </div>
                    <div className="text-xs font-medium text-gray-700">{step.title}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Tab Content */}
            <div className="bg-white rounded-lg shadow">
              {/* General Info Tab */}
              {activeTab === 'general' && (
                <div className="p-6">
                  <h3 className="text-lg font-semibold text-gray-900 mb-4">📝 General Information</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Project Name *</label>
                      <input
                        type="text"
                        value={currentData.general.projectName}
                        onChange={(e) => updateData('general', { ...currentData.general, projectName: e.target.value })}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter project name"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Business Purpose *</label>
                      <textarea
                        value={currentData.general.businessPurpose}
                        onChange={(e) => updateData('general', { ...currentData.general, businessPurpose: e.target.value })}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        rows="3"
                        placeholder="Describe the business purpose of this data lineage"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Data Owner</label>
                      <input
                        type="text"
                        value={currentData.general.dataOwner}
                        onChange={(e) => updateData('general', { ...currentData.general, dataOwner: e.target.value })}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter data owner name"
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* Sources Tab */}
              {activeTab === 'sources' && (
                <div className="p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-semibold text-gray-900">📁 Data Sources</h3>
                    <div className="flex gap-2">
                      <button
                        onClick={addSource}
                        className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                      >
                        📋 From Catalog
                      </button>
                      <button
                        onClick={addManualSource}
                        className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors"
                      >
                        ✏️ Manual Entry
                      </button>
                    </div>
                  </div>
                  
                  <div className="space-y-4">
                    {currentData.sources.map((source, index) => (
                      <div key={source.id} className={`border rounded-lg p-4 ${
                        source.isFromCatalog ? 'border-blue-200 bg-blue-50' : 'border-gray-200'
                      }`}>
                        <div className="flex items-center justify-between mb-3">
                          <div className="flex items-center gap-2">
                            <h4 className="font-medium text-gray-900">
                              {source.name || `Source ${index + 1}`}
                            </h4>
                            {source.isFromCatalog && (
                              <span className="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded">
                                {source.isNewlyCreated ? '🆕 New Asset' : '📋 From Catalog'}
                              </span>
                            )}
                          </div>
                          <button
                            onClick={() => removeSource(source.id)}
                            className="text-red-500 hover:text-red-700"
                          >
                            ✕
                          </button>
                        </div>
                        {source.isFromCatalog ? (
                          /* Read-only display for catalog assets */
                          <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-4">
                              <div>
                                <span className="text-sm font-medium text-gray-700">Type:</span>
                                <span className="ml-2 px-2 py-1 bg-gray-100 text-gray-800 rounded text-sm">{source.type}</span>
                              </div>
                              <div>
                                <span className="text-sm font-medium text-gray-700">Location:</span>
                                <span className="ml-2 text-sm text-gray-600">{source.location}</span>
                              </div>
                            </div>
                            {source.description && (
                              <div>
                                <span className="text-sm font-medium text-gray-700">Description:</span>
                                <p className="mt-1 text-sm text-gray-600">{source.description}</p>
                              </div>
                            )}
                          </div>
                        ) : (
                          /* Editable fields for manual entries */
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">Name</label>
                              <input
                                type="text"
                                value={source.name}
                                onChange={(e) => updateSource(source.id, 'name', e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              />
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">Type</label>
                              <select
                                value={source.type}
                                onChange={(e) => updateSource(source.id, 'type', e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              >
                                <option value="table">Table</option>
                                <option value="file">File</option>
                                <option value="api">API</option>
                                <option value="stream">Stream</option>
                              </select>
                            </div>
                            <div className="col-span-2">
                              <label className="block text-sm font-medium text-gray-700 mb-1">Description</label>
                              <input
                                type="text"
                                value={source.description}
                                onChange={(e) => updateSource(source.id, 'description', e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              />
                            </div>
                            <div className="col-span-2 pt-2 border-t border-gray-100">
                              <button
                                onClick={() => convertManualAssetToCatalog(source, 'sources')}
                                className="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors text-sm"
                                title="Save this asset to the main catalog"
                              >
                                💾 Save to Catalog
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                    
                    {currentData.sources.length === 0 && (
                      <div className="text-center py-8 text-gray-500">
                        <div className="text-4xl mb-2">📁</div>
                        <p>No data sources added yet</p>
                        <p className="text-sm">Click "Add Source" to get started</p>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Processing Tab */}
              {activeTab === 'processing' && (
                <div className="p-6">
                  <h3 className="text-lg font-semibold text-gray-900 mb-4">⚙️ Processing Steps</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Processing Method</label>
                      <select
                        value={currentData.processing.method || ''}
                        onChange={(e) => updateData('processing', { ...currentData.processing, method: e.target.value })}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="">Select processing method</option>
                        <option value="batch">Batch Processing</option>
                        <option value="stream">Stream Processing</option>
                        <option value="realtime">Real-time Processing</option>
                        <option value="etl">ETL Pipeline</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Processing Description</label>
                      <textarea
                        value={currentData.processing.description || ''}
                        onChange={(e) => updateData('processing', { ...currentData.processing, description: e.target.value })}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        rows="4"
                        placeholder="Describe the processing steps and transformations"
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* Integration Tab */}
              {activeTab === 'intermediate' && (
                <div className="p-6">
                  <h3 className="text-lg font-semibold text-gray-900 mb-4">🔄 Integration Steps</h3>
                  <div className="text-center py-8 text-gray-500">
                    <div className="text-4xl mb-2">🔄</div>
                    <p>Integration configuration coming soon</p>
                    <p className="text-sm">This will include data transformation and integration rules</p>
                  </div>
                </div>
              )}

              {/* Outputs Tab */}
              {activeTab === 'outputs' && (
                <div className="p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-semibold text-gray-900">🎯 Outputs</h3>
                    <div className="flex gap-2">
                      <button
                        onClick={addOutput}
                        className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                      >
                        📋 From Catalog
                      </button>
                      <button
                        onClick={addManualOutput}
                        className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors"
                      >
                        ✏️ Manual Entry
                      </button>
                    </div>
                  </div>
                  
                  <div className="space-y-4">
                    {currentData.outputs.map((output, index) => (
                      <div key={output.id} className={`border rounded-lg p-4 ${output.isFromCatalog ? 'border-blue-200 bg-blue-50' : 'border-gray-200'}`}>
                        <div className="flex items-center justify-between mb-3">
                          <div className="flex items-center gap-2">
                            <h4 className="font-medium text-gray-900">Output {index + 1}</h4>
                            {output.isFromCatalog && (
                              <span className="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full">
                                📋 From Catalog
                              </span>
                            )}
                          </div>
                          <button
                            onClick={() => removeOutput(output.id)}
                            className="text-red-500 hover:text-red-700"
                          >
                            ✕
                          </button>
                        </div>
                        
                        {output.isFromCatalog ? (
                          // Read-only display for catalog assets
                          <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-4">
                              <div>
                                <span className="text-sm font-medium text-gray-700">Type:</span>
                                <span className="ml-2 px-2 py-1 bg-gray-100 text-gray-800 rounded text-sm">{output.type}</span>
                              </div>
                              <div>
                                <span className="text-sm font-medium text-gray-700">Name:</span>
                                <span className="ml-2 text-gray-900 font-medium">{output.name}</span>
                              </div>
                            </div>
                            {output.description && (
                              <div>
                                <span className="text-sm font-medium text-gray-700">Description:</span>
                                <p className="mt-1 text-sm text-gray-600">{output.description}</p>
                              </div>
                            )}
                            <div>
                              <span className="text-sm font-medium text-gray-700">Source:</span>
                              <span className="ml-2 text-xs text-blue-600">{output.location}</span>
                            </div>
                          </div>
                        ) : (
                          // Editable form for manual entries
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">Name</label>
                              <input
                                type="text"
                                value={output.name}
                                onChange={(e) => updateOutput(output.id, 'name', e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              />
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">Type</label>
                              <select
                                value={output.type}
                                onChange={(e) => updateOutput(output.id, 'type', e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              >
                                <option value="table">Table</option>
                                <option value="report">Report</option>
                                <option value="dashboard">Dashboard</option>
                                <option value="file">File</option>
                              </select>
                            </div>
                            <div className="col-span-2">
                              <label className="block text-sm font-medium text-gray-700 mb-1">Description</label>
                              <input
                                type="text"
                                value={output.description}
                                onChange={(e) => updateOutput(output.id, 'description', e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              />
                            </div>
                            <div className="col-span-2">
                              <label className="block text-sm font-medium text-gray-700 mb-1">Location</label>
                              <input
                                type="text"
                                value={output.location || ''}
                                onChange={(e) => updateOutput(output.id, 'location', e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Database, file path, etc."
                              />
                            </div>
                            <div className="col-span-2 pt-2 border-t border-gray-100">
                              <button
                                onClick={() => convertManualAssetToCatalog(output, 'outputs')}
                                className="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors text-sm"
                                title="Save this asset to the main catalog"
                              >
                                💾 Save to Catalog
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                    
                    {currentData.outputs.length === 0 && (
                      <div className="text-center py-8 text-gray-500">
                        <div className="text-4xl mb-2">🎯</div>
                        <p>No outputs defined yet</p>
                        <p className="text-sm">Click "Add Output" to get started</p>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>

            {/* Visual Flow Diagram */}
            <div className="bg-white rounded-lg shadow p-6">
              <h3 className="text-lg font-semibold text-gray-900 mb-4">🌊 Data Flow Visualization</h3>
              <LineageFlowDiagram 
                sources={currentData.sources}
                processing={currentData.processing}
                outputs={currentData.outputs}
              />
            </div>
            
            {/* Asset Picker Modal */}
            <AssetPicker
              isOpen={showAssetPicker}
              onClose={() => setShowAssetPicker(false)}
              onSelectAsset={handleAssetSelect}
              onCreateAsset={handleAssetCreate}
              assets={assets}
              title={assetPickerMode === 'source' ? 'Select Source Asset' : 'Select Output Asset'}
            />
          </div>
        );
      };

      /**********************************************************************
       * AssetPicker Component - Select existing assets or create new ones
       **********************************************************************/
      const AssetPicker = ({ isOpen, onClose, onSelectAsset, onCreateAsset, assets, title = "Select Asset" }) => {
        const [searchQuery, setSearchQuery] = React.useState('');
        const [showCreateForm, setShowCreateForm] = React.useState(false);
        const [newAssetData, setNewAssetData] = React.useState({
          name: '',
          type: 'table',
          description: '',
          owner: '',
          businessArea: 'Data',
          tags: []
        });

        const filteredAssets = assets.filter(asset => 
          asset.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          asset.type.toLowerCase().includes(searchQuery.toLowerCase()) ||
          asset.businessArea.toLowerCase().includes(searchQuery.toLowerCase())
        );

        const handleCreateAsset = () => {
          if (!newAssetData.name.trim()) return;
          
          const newAsset = {
            id: Date.now(),
            ...newAssetData,
            lastUpdated: new Date().toISOString().split('T')[0],
            tags: newAssetData.tags.filter(tag => tag.trim()),
            additionalInfo: {},
            kpis: [],
            endorsed: false,
            classification: 'Internal'
          };
          
          onCreateAsset(newAsset);
          onSelectAsset(newAsset);
          setShowCreateForm(false);
          setNewAssetData({
            name: '',
            type: 'table',
            description: '',
            owner: '',
            businessArea: 'Data',
            tags: []
          });
          onClose();
        };

        React.useEffect(() => {
          if (isOpen) {
            setSearchQuery('');
            setShowCreateForm(false);
          }
        }, [isOpen]);

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden">
              <div className="flex items-center justify-between p-6 border-b">
                <h3 className="text-lg font-semibold text-gray-900">{title}</h3>
                <button
                  onClick={onClose}
                  className="text-gray-400 hover:text-gray-600"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>

              <div className="p-6">
                {!showCreateForm ? (
                  <>
                    {/* Search and Create Button */}
                    <div className="flex gap-4 mb-6">
                      <div className="flex-1">
                        <input
                          type="text"
                          placeholder="Search assets..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <button
                        onClick={() => setShowCreateForm(true)}
                        className="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors"
                      >
                        + Create New Asset
                      </button>
                    </div>

                    {/* Asset List */}
                    <div className="max-h-96 overflow-y-auto">
                      {filteredAssets.length > 0 ? (
                        <div className="grid gap-3">
                          {filteredAssets.map((asset) => (
                            <div
                              key={asset.id}
                              onClick={() => {
                                onSelectAsset(asset);
                                onClose();
                              }}
                              className="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors"
                            >
                              <div className="flex items-center justify-between">
                                <div className="flex-1">
                                  <h4 className="font-medium text-gray-900">{asset.name}</h4>
                                  <p className="text-sm text-gray-600 mt-1">{asset.description}</p>
                                  <div className="flex items-center gap-4 mt-2 text-xs text-gray-500">
                                    <span className="px-2 py-1 bg-blue-100 text-blue-800 rounded">{asset.type}</span>
                                    <span>{asset.businessArea}</span>
                                    <span>{asset.owner}</span>
                                  </div>
                                </div>
                                <div className="text-gray-400">
                                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                  </svg>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="text-center py-8 text-gray-500">
                          <div className="text-4xl mb-2">🔍</div>
                          <p>No assets found</p>
                          {searchQuery && <p className="text-sm">Try adjusting your search terms</p>}
                        </div>
                      )}
                    </div>
                  </>
                ) : (
                  /* Create New Asset Form */
                  <div className="space-y-4">
                    <div className="flex items-center justify-between mb-4">
                      <h4 className="text-lg font-medium text-gray-900">Create New Asset</h4>
                      <button
                        onClick={() => setShowCreateForm(false)}
                        className="text-gray-500 hover:text-gray-700"
                      >
                        ← Back to Assets
                      </button>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Asset Name *</label>
                        <input
                          type="text"
                          value={newAssetData.name}
                          onChange={(e) => setNewAssetData({...newAssetData, name: e.target.value})}
                          className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="Enter asset name"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Type</label>
                        <select
                          value={newAssetData.type}
                          onChange={(e) => setNewAssetData({...newAssetData, type: e.target.value})}
                          className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

       * LineageFlowDiagram Component - Visual representation of data flow
       **********************************************************************/

        if (sources.length === 0 && outputs.length === 0) {

        return (
          <div className="relative">
            {/* Flow Container */}
            <div className="flex items-center justify-between min-h-48 p-6">
              {/* Sources */}
              <div className="flex flex-col space-y-4">
                <h4 className="text-sm font-medium text-gray-700 text-center">Sources</h4>
                {sources.map((source, index) => (
                  <div key={source.id} className="bg-blue-100 border border-blue-300 rounded-lg p-3 min-w-32">
                    <div className="text-sm font-medium text-blue-800">{source.name || `Source ${index + 1}`}</div>
                    <div className="text-xs text-blue-600">{source.type}</div>

              {/* Processing Arrow */}
              <div className="flex-1 flex items-center justify-center mx-8">

                  <div className="w-32 h-px bg-gray-400 relative">
                    <div className="absolute right-0 top-0 w-0 h-0 border-l-4 border-l-gray-400 border-t-2 border-t-transparent border-b-2 border-b-transparent transform -translate-y-1/2"></div>
                  </div>
                  <div className="text-xs text-gray-600 mt-2 text-center">
                    {processing.method || 'Processing'}
                  </div>
                </div>
              </div>

              {/* Outputs */}
              <div className="flex flex-col space-y-4">
                <h4 className="text-sm font-medium text-gray-700 text-center">Outputs</h4>
                {outputs.map((output, index) => (
                  <div key={output.id} className="bg-green-100 border border-green-300 rounded-lg p-3 min-w-32">
                    <div className="text-sm font-medium text-green-800">{output.name || `Output ${index + 1}`}</div>
                    <div className="text-xs text-green-600">{output.type}</div>

      };

      /**********************************************************************
       * Main App Component – Responsive layout with centered container.
       **********************************************************************/
      /**********************************************************************
       * ENTERPRISE VARIABLE VIEW COMPONENTS
       **********************************************************************/
      
      // Variable analysis utility functions
      const VariableAnalyzer = {
        // Extract all variables from assets with their metadata
        extractVariables: (assets, manualLinks = []) => {
          const variableMap = new Map();
          
          assets.forEach(asset => {
            if (asset.schemaColumns && Array.isArray(asset.schemaColumns)) {
              asset.schemaColumns.forEach(column => {
                const variableKey = column.name.toLowerCase();
                
                if (!variableMap.has(variableKey)) {
                  variableMap.set(variableKey, {
                    name: column.name,
                    occurrences: [],
                    types: new Set(),
                    descriptions: new Set(),
                    sensitivities: new Set(),
                    businessRules: new Set(),
                    assetCount: 0,
                    commonPatterns: {
                      isId: column.name.toLowerCase().includes('id'),
                      isDate: column.type.toLowerCase().includes('date') || column.type.toLowerCase().includes('timestamp'),
                      isEmail: column.name.toLowerCase().includes('email'),
                      isAmount: column.type.toLowerCase().includes('decimal') || column.name.toLowerCase().includes('amount') || column.name.toLowerCase().includes('value'),
                      isPrimaryKey: column.isPrimaryKey || false,
                      isRequired: !column.nullable
                    }
                  });
                }
                
                const variable = variableMap.get(variableKey);
                variable.occurrences.push({
                  assetId: asset.id,
                  assetName: asset.name,
                  assetType: asset.type,
                  businessArea: asset.businessArea,
                  columnDefinition: column
                });
                
                variable.types.add(column.type);
                if (column.description) variable.descriptions.add(column.description);
                if (column.sensitivity) variable.sensitivities.add(column.sensitivity);
                if (column.businessRules) variable.businessRules.add(column.businessRules);
                variable.assetCount = variable.occurrences.length;
              });
            }
          });
          
          // Apply manual variable links
          const linkedVariables = VariableAnalyzer.applyManualLinks(Array.from(variableMap.values()), manualLinks);
          
          return linkedVariables.sort((a, b) => b.assetCount - a.assetCount);
        },
        
        // Find similar variables by name patterns
        findSimilarVariables: (variables) => {
          const patterns = {};
          
          variables.forEach(variable => {
            const baseName = variable.name.toLowerCase()
              .replace(/_id$|_key$|_uuid$/, '_identifier')
              .replace(/_date$|_time$|_timestamp$/, '_temporal')
              .replace(/_email$|_mail$/, '_email')
              .replace(/_amount$|_value$|_cost$|_price$/, '_monetary');
            
            if (!patterns[baseName]) {
              patterns[baseName] = [];
            }
            patterns[baseName].push(variable);
          });
          
          return Object.entries(patterns)
            .filter(([_, vars]) => vars.length > 1)
            .sort(([_, a], [__, b]) => b.length - a.length);
        },
        
        // Analyze data governance patterns
        analyzeGovernance: (variables) => {
          const governance = {
            highSensitivity: variables.filter(v => 
              Array.from(v.sensitivities).some(s => s && s.toLowerCase() === 'high')
            ),
            crossAssetIdentifiers: variables.filter(v => 
              v.assetCount > 1 && v.commonPatterns.isId
            ),
            commonBusinessEntities: variables.filter(v => 
              v.assetCount > 2
            ),
            inconsistentTypes: variables.filter(v => v.types.size > 1),
            orphanedVariables: variables.filter(v => v.assetCount === 1)
          };
          
          return governance;
        },
        
        // Apply manual variable links to merge variables
        applyManualLinks: (variables, manualLinks) => {
          if (!manualLinks || manualLinks.length === 0) {
            return variables;
          }
          
          const linkedVariables = [...variables];
          const processedGroups = new Set();
          
          manualLinks.forEach(link => {
            if (processedGroups.has(link.groupId)) return;
            
            const groupVariables = linkedVariables.filter(v => 
              link.variableIds.some(id => VariableAnalyzer.getVariableId(v) === id)
            );
            
            if (groupVariables.length > 1) {
              // Merge variables in this group
              const mergedVariable = VariableAnalyzer.mergeVariables(groupVariables, link);
              
              // Remove individual variables
              const variableIds = groupVariables.map(v => VariableAnalyzer.getVariableId(v));
              const filteredVariables = linkedVariables.filter(v => 
                !variableIds.includes(VariableAnalyzer.getVariableId(v))
              );
              
              // Add merged variable
              filteredVariables.push(mergedVariable);
              linkedVariables.length = 0;
              linkedVariables.push(...filteredVariables);
            }
            
            processedGroups.add(link.groupId);
          });
          
          return linkedVariables;
        },
        
        // Generate unique ID for a variable based on name and first asset
        getVariableId: (variable) => {
          const firstAsset = variable.occurrences[0];
          return `${variable.name.toLowerCase()}_${firstAsset.assetId}`;
        },
        
        // Merge multiple variables into a single linked variable
        mergeVariables: (variables, linkInfo) => {
          const mergedVariable = {
            name: linkInfo.displayName || variables[0].name,
            occurrences: [],
            types: new Set(),
            descriptions: new Set(),
            sensitivities: new Set(),
            businessRules: new Set(),
            assetCount: 0,
            isManuallyLinked: true,
            linkedGroupId: linkInfo.groupId,
            originalVariables: variables.map(v => ({
              originalName: v.name,
              occurrences: v.occurrences.length
            })),
            commonPatterns: {
              isId: variables.some(v => v.commonPatterns.isId),
              isDate: variables.some(v => v.commonPatterns.isDate),
              isEmail: variables.some(v => v.commonPatterns.isEmail),
              isAmount: variables.some(v => v.commonPatterns.isAmount),
              isPrimaryKey: variables.some(v => v.commonPatterns.isPrimaryKey),
              isRequired: variables.some(v => v.commonPatterns.isRequired)
            }
          };
          
          // Merge all occurrences and metadata
          variables.forEach(variable => {
            mergedVariable.occurrences.push(...variable.occurrences);
            variable.types.forEach(type => mergedVariable.types.add(type));
            variable.descriptions.forEach(desc => mergedVariable.descriptions.add(desc));
            variable.sensitivities.forEach(sens => mergedVariable.sensitivities.add(sens));
            variable.businessRules.forEach(rule => mergedVariable.businessRules.add(rule));
          });
          
          mergedVariable.assetCount = mergedVariable.occurrences.length;
          
          return mergedVariable;
        },
        
        // Get variables that can be linked (not already in a group)
        getLinkableVariables: (variables, manualLinks) => {
          const linkedVariableIds = new Set();
          
          manualLinks.forEach(link => {
            link.variableIds.forEach(id => linkedVariableIds.add(id));
          });
          
          return variables.filter(variable => {
            const variableId = VariableAnalyzer.getVariableId(variable);
            return !linkedVariableIds.has(variableId) && !variable.isManuallyLinked;
          });
        }
      };

      // Variable Detail Modal Component
      const VariableDetailModal = ({ variable, onClose, assets }) => {
        if (!variable) return null;
        
        const modalRef = React.useRef(null);
        
        React.useEffect(() => {

              <div className="flex items-center justify-between p-6 border-b">
                <div>
                  <div className="flex items-center space-x-3">

                    </p>

                </div>
                <button

                  ×
                </button>
              </div>
              
              <div className="p-6 overflow-y-auto max-h-[70vh]">
                {/* Variable Summary */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                  <div className="bg-blue-50 p-4 rounded-lg">
                    <h3 className="font-semibold text-blue-900 mb-2">Data Types</h3>
                    <div className="space-y-1">
                      {Array.from(variable.types).map(type => (
                        <span key={type} className="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm mr-1">

                        </span>
                      ))}
                    </div>
                  </div>
                  
                  <div className="bg-green-50 p-4 rounded-lg">
                    <h3 className="font-semibold text-green-900 mb-2">Sensitivity Levels</h3>
                    <div className="space-y-1">
                      {Array.from(variable.sensitivities).map(sensitivity => (
                        <span key={sensitivity} className={`inline-block px-2 py-1 rounded text-sm mr-1 ${
                          sensitivity === 'high' ? 'bg-red-100 text-red-800' :
                          sensitivity === 'medium' ? 'bg-yellow-100 text-yellow-800' :
                          'bg-green-100 text-green-800'
                        }`}>
                          {sensitivity}
                        </span>
                      ))}
                    </div>
                  </div>
                  
                  <div className="bg-purple-50 p-4 rounded-lg">
                    <h3 className="font-semibold text-purple-900 mb-2">Common Patterns</h3>
                    <div className="space-y-1 text-sm">
                      {variable.commonPatterns.isId && <div className="text-purple-700">🔑 Identifier</div>}
                      {variable.commonPatterns.isDate && <div className="text-purple-700">📅 Temporal</div>}
                      {variable.commonPatterns.isEmail && <div className="text-purple-700">📧 Email</div>}
                      {variable.commonPatterns.isAmount && <div className="text-purple-700">💰 Monetary</div>}
                      {variable.commonPatterns.isPrimaryKey && <div className="text-purple-700">🗝️ Primary Key</div>}
                      {variable.commonPatterns.isRequired && <div className="text-purple-700">❗ Required</div>}
                    </div>
                  </div>
                </div>
                
                {/* Asset Occurrences */}
                <div>
                  <h3 className="text-lg font-semibold text-gray-900 mb-4">Asset Occurrences</h3>
                  <div className="space-y-4">
                    {variable.occurrences.map((occurrence, index) => (
                      <div key={index} className="border rounded-lg p-4 hover:shadow-md transition-shadow">
                        <div className="flex items-start justify-between mb-2">
                          <div>
                            <h4 className="font-medium text-gray-900">{occurrence.assetName}</h4>
                            <div className="flex items-center space-x-2 text-sm text-gray-600">
                              <span>{occurrence.assetType}</span>
                              <span>•</span>
                              <span>{occurrence.businessArea}</span>
                            </div>
                          </div>
                          <span className={`px-2 py-1 rounded text-xs font-medium ${
                            occurrence.columnDefinition.type ? 'bg-gray-100 text-gray-800' : 'bg-yellow-100 text-yellow-800'
                          }`}>
                            {occurrence.columnDefinition.type || 'No type'}
                          </span>
                        </div>
                        
                        {occurrence.columnDefinition.description && (
                          <p className="text-sm text-gray-700 mb-2">{occurrence.columnDefinition.description}</p>
                        )}
                        
                        <div className="grid grid-cols-2 gap-4 text-xs text-gray-600">
                          <div>
                            <span className="font-medium">Nullable:</span> {occurrence.columnDefinition.nullable ? 'Yes' : 'No'}
                          </div>
                          <div>
                            <span className="font-medium">Unique:</span> {occurrence.columnDefinition.unique ? 'Yes' : 'No'}
                          </div>
                        </div>
                        
                        {occurrence.columnDefinition.businessRules && (
                          <div className="mt-2 p-2 bg-gray-50 rounded text-xs">
                            <span className="font-medium">Business Rules:</span> {occurrence.columnDefinition.businessRules}
                          </div>
