              <input type="text" placeholder="Term" value={newTerm.term} onChange={(e) => setNewTerm({ ...newTerm, term: e.target.value })} className="w-full mb-2 px-3 py-1 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
              <textarea placeholder="Definition" value={newTerm.definition} onChange={(e) => setNewTerm({ ...newTerm, definition: e.target.value })} className="w-full mb-2 px-3 py-1 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              <button onClick={addGlossaryTerm} className="px-3 py-1 bg-blue-500 text-white rounded transition-colors">Add Term</button>
            </div>
          </div>
        );
      };

      /**********************************************************************
       * Reusable Components for Editable Details
       **********************************************************************/
      const ColumnComponents = ({ asset, editable, onUpdate }) => {
        const handleComponentChange = (index, key, value) => {
          const newComponents = asset.components.map((comp, i) =>
            i === index ? { ...comp, [key]: value } : comp
          );
          onUpdate({ ...asset, components: newComponents });
        };
        return (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {(asset.components || []).map((comp, index) => (
              <div key={index} className="p-4 border rounded-lg bg-gray-100">
                {editable ? (
                  <>
                    <input type="text" value={comp.title} onChange={(e) => handleComponentChange(index, 'title', e.target.value)} className="mb-1 w-full border rounded px-2 py-1 text-sm focus:outline-none" placeholder="Component Title" />
                    <textarea value={comp.description} onChange={(e) => handleComponentChange(index, 'description', e.target.value)} className="w-full border rounded px-2 py-1 text-xs focus:outline-none" placeholder="Component Description"></textarea>
                  </>
                ) : (
                  <>
                    <h4 className="text-sm font-semibold text-gray-600 mb-1">{comp.title}</h4>
                    <p className="text-xs text-gray-700">{comp.description}</p>
                  </>
                )}
              </div>
            ))}
          </div>
        );
      };

      // Updated Additional Information now renders as a two-column grid.
      const EditableAdditionalInfo = ({ asset, editable, onUpdate }) => {
        const handleInfoChange = (key, value) => {
          const newInfo = { ...asset.additionalInfo, [key]: value };
          onUpdate({ ...asset, additionalInfo: newInfo });
        };
        if (!asset.additionalInfo) return null;
        return (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {Object.entries(asset.additionalInfo).map(([key, value]) => (
              <div key={key}>
                <h3 className="text-sm font-semibold text-gray-500 capitalize">{key.replace(/([A-Z])/g, ' $1')}</h3>
                {editable ? (
                  <textarea value={value} onChange={(e) => handleInfoChange(key, e.target.value)} className="w-full border rounded px-2 py-1 text-xs focus:outline-none"></textarea>
                ) : (
                  <p className="text-xs text-gray-700">{value}</p>
                )}
              </div>
            ))}
          </div>
        );
      };

      /**********************************************************************
       * ComplianceSection Component – Displays compliance and regulatory information
       **********************************************************************/
      const ComplianceSection = ({ asset, setSelectedCompliance }) => {
        const getStatusColor = (status) => {
          switch (status?.toLowerCase()) {
            case 'compliant':
            case 'active':
              return 'bg-green-100 text-green-800';
            case 'non-compliant':
            case 'expired':
              return 'bg-red-100 text-red-800';
            case 'pending':
            case 'under review':
              return 'bg-yellow-100 text-yellow-800';
            case 'not applicable':
              return 'bg-gray-100 text-gray-800';
            default:
              return 'bg-blue-100 text-blue-800';
          }
        };

        const getCriticalityColor = (criticality) => {
          switch (criticality?.toLowerCase()) {
            case 'high':
              return 'bg-red-100 text-red-800 border-red-200';
            case 'medium':
              return 'bg-yellow-100 text-yellow-800 border-yellow-200';
            case 'low':
              return 'bg-green-100 text-green-800 border-green-200';
            default:
              return 'bg-gray-100 text-gray-800 border-gray-200';
          }
        };

        const formatDate = (dateString) => {
          if (!dateString) return 'Not specified';
          return new Date(dateString).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });
        };

        // Get compliance requirements mapped to this asset
        const getAssetCompliances = () => {
          if (!asset.complianceIDs || asset.complianceIDs.length === 0) {
            return [];
          }
          
          return asset.complianceIDs.map(complianceID => {
            const compliance = COMPLIANCE_REGISTRY[complianceID];
            if (compliance) {
              return { ...compliance };
            }
            // Fallback for unknown compliance IDs
            return {
              complianceID,
              name: `Unknown Compliance: ${complianceID}`,
              description: 'Compliance details not found in registry',
              status: 'Unknown',
              criticality: 'Medium'
            };
          });
        };

        const compliances = getAssetCompliances();
        const complianceCriticality = asset.complianceCriticality || "Medium";

        return (
          <div className="space-y-4">
            {/* Asset Compliance Overview */}
            <div className="bg-white border rounded-lg p-4">
              <div className="flex items-center justify-between mb-4">
                <h4 className="text-lg font-semibold text-gray-900">Asset Compliance Status</h4>
                <span className={`px-3 py-1 rounded-full text-sm font-medium border ${getCriticalityColor(complianceCriticality)}`}>
                  {complianceCriticality} Criticality
                </span>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div className="text-center p-3 bg-gray-50 rounded">
                  <div className="text-2xl font-bold text-blue-600">{compliances.length}</div>
                  <div className="text-sm text-gray-600">Total Requirements</div>
                </div>
                <div className="text-center p-3 bg-gray-50 rounded">
                  <div className="text-2xl font-bold text-green-600">
                    {compliances.filter(c => ['compliant', 'active'].includes(c.status?.toLowerCase())).length}
                  </div>
                  <div className="text-sm text-gray-600">Compliant</div>
                </div>
                <div className="text-center p-3 bg-gray-50 rounded">
                  <div className="text-2xl font-bold text-yellow-600">
                    {compliances.filter(c => ['pending', 'under review'].includes(c.status?.toLowerCase())).length}
                  </div>
                  <div className="text-sm text-gray-600">Under Review</div>
                </div>
              </div>
            </div>

            {/* Compliance Requirements List */}
            <div className="space-y-3">
              {compliances.map((compliance, index) => (
                <div key={compliance.complianceID || index} className="bg-white border rounded-lg p-4 hover:shadow-md transition-shadow cursor-pointer" onClick={() => setSelectedCompliance && setSelectedCompliance(compliance)}>
                  <div className="flex items-start justify-between mb-3">
                    <div className="flex-1">
                      <div className="flex items-center space-x-3 mb-2">
                        <h5 className="font-semibold text-gray-900 hover:text-blue-600 transition-colors">{compliance.name}</h5>
                        <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">
                          {compliance.complianceID}
                        </span>
                        <span className={`px-2 py-1 rounded-full text-xs font-medium ${getStatusColor(compliance.status)}`}>
                          {compliance.status || 'Unknown'}
                        </span>
                        {setSelectedCompliance && (
                          <span className="text-xs text-blue-600 hover:text-blue-800 font-medium">
                            Click for details →
                          </span>
                        )}
                      </div>
                      <p className="text-sm text-gray-600 mb-3">{compliance.description}</p>
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
                    <div>
                      <span className="font-medium text-gray-700">Regulatory Body:</span>
                      <p className="text-gray-600">{compliance.regulatoryBody}</p>
                    </div>
                    <div>
                      <span className="font-medium text-gray-700">Effective Date:</span>
                      <p className="text-gray-600">{formatDate(compliance.effectiveDate)}</p>
                    </div>
                    <div>
                      <span className="font-medium text-gray-700">Review Frequency:</span>
                      <p className="text-gray-600">{compliance.reviewFrequency}</p>
                    </div>
                    <div>
                      <span className="font-medium text-gray-700">Criticality:</span>
                      <span className={`px-2 py-1 rounded text-xs font-medium ${getCriticalityColor(compliance.criticality)}`}>
                        {compliance.criticality || 'Not Set'}
                      </span>
                    </div>
                  </div>
                  
                  {/* Show other assets linked to this compliance */}
                  {compliance.linkedAssetIDs && compliance.linkedAssetIDs.length > 1 && (
                    <div className="mt-3 pt-3 border-t border-gray-100">
                      <span className="text-xs font-medium text-gray-700">Other linked assets: </span>
                      <div className="flex flex-wrap gap-1 mt-1">
                        {compliance.linkedAssetIDs
                          .filter(id => id.toString() !== asset.id.toString())
                          .map(linkedAssetId => (
                            <span key={linkedAssetId} className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">
                              Asset {linkedAssetId}
                            </span>
                          ))}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {compliances.length === 0 && (
              <div className="bg-gray-50 p-4 rounded">
                <p className="text-gray-500 text-center">No compliance requirements defined for this asset</p>
              </div>
            )}
          </div>
        );
      };

      /**********************************************************************
       * DetailPanel Component – Re-organized Layout
       * Upper Section: A compact summary displaying key details (Type, Business Area, Owner, Last Updated)
       * and a second row for KPIs and Tags.
       * Additional Information is now rendered as a two-column grid within the upper section.
       * Lower Section (Full Width): Components, Linked Assets, (Dataset Schema for Datasets), Lineage Flow, Embedded Items, and Request Access.
       * In edit mode, Save and Cancel buttons allow changes to be saved.
       **********************************************************************/
      const DetailPanel = ({ asset, onClose, onAssetUpdate, editMode, onAssetSelect, setSelectedCompliance, onOpenLineage, onOpenLineageProject }) => {
        React.useEffect(() => {
          const handleKeyDown = (e) => { if (e.key === "Escape") onClose(); };
          document.addEventListener("keydown", handleKeyDown);
          return () => document.removeEventListener("keydown", handleKeyDown);
        }, [onClose]);
        const closePanel = (e) => { if (e.target.id === "detailPanelBackdrop") onClose(); };
        const [editableAsset, setEditableAsset] = React.useState({ ...asset });
        const [showRequestAccess, setShowRequestAccess] = React.useState(false);
        const [activeTab, setActiveTab] = React.useState('overview');
        const updateKpi = (index, key, value) => {
          const newKpis = editableAsset.kpis.map((kpi, i) =>
            i === index ? { ...kpi, [key]: value } : kpi
          );
          setEditableAsset({ ...editableAsset, kpis: newKpis });
        };
        const addKpi = () => {
          setEditableAsset({
            ...editableAsset,
            kpis: [...(editableAsset.kpis || []), { metric: '', value: '', type: 'trendingUp' }]
          });
        };
        const updateComponent = (index, key, value) => {
          const newComponents = (editableAsset.components || []).map((comp, i) =>
            i === index ? { ...comp, [key]: value } : comp
          );
          setEditableAsset({ ...editableAsset, components: newComponents });
        };
        const addComponent = () => {
          setEditableAsset({
            ...editableAsset,
            components: [...(editableAsset.components || []), { title: '', description: '' }]
          });
        };
        // Merge lineage data safely
        const lineageFlowData = (() => {
          let data = [];
          if (editableAsset.lineageFlowData) {
            data = Array.isArray(editableAsset.lineageFlowData)
              ? [...editableAsset.lineageFlowData]
              : Object.values(editableAsset.lineageFlowData).flat();
          }
          if (editableAsset.linkedAssets) {
            editableAsset.linkedAssets.forEach(linked => {
              if (linked.lineageFlowData) {
                data = data.concat(
                  Array.isArray(linked.lineageFlowData)
                    ? linked.lineageFlowData
                    : Object.values(linked.lineageFlowData).flat()
                );
              }
            });
          }
          return data;
        })();
        return (
          <div id="detailPanelBackdrop" onClick={closePanel} className="fixed top-0 right-0 bottom-0 z-50 w-full md:w-[700px] bg-white shadow-xl transition-transform duration-300 overflow-y-auto" role="dialog" aria-modal="true" data-testid="detail-panel">
            <div className="p-8 relative">
              <button onClick={onClose} className="absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-3xl focus:outline-none" aria-label="Close detail panel" data-testid="close-detail-panel">&times;</button>
              {/* Header: Asset Name and Classification */}
              <div className="mb-6">
                {editMode ? (
                  <input type="text" value={editableAsset.name} onChange={(e) => setEditableAsset({ ...editableAsset, name: e.target.value })} className="w-full text-3xl font-bold text-gray-900 border-b border-gray-300 focus:outline-none" />
                ) : (
                  <h2 className="text-3xl font-bold text-gray-900">{asset.name}</h2>
                )}
                <div className="flex items-center mt-2">
                  <span className="text-sm font-semibold text-gray-700">Classification:</span>
                  {editMode ? (
                    <>
                      <select value={editableAsset.classification || "Internal"} onChange={(e) => setEditableAsset({ ...editableAsset, classification: e.target.value })} className="ml-2 border rounded px-2 py-1 text-sm focus:outline-none">
                        <option value="Internal">Internal</option>
                        <option value="Confidential">Confidential</option>
                        <option value="Highly Confidential">Highly Confidential</option>
                      </select>
                      <span className="ml-2">{getClassificationIcon(editableAsset.classification)}</span>
                    </>
                  ) : (
                    <>
                      <span className="ml-2 text-sm text-gray-900">{asset.classification || "Internal"}</span>
                      <span className="ml-2">{getClassificationIcon(asset.classification)}</span>
                    </>
                  )}
                </div>
                
                {/* Action Buttons */}
                <div className="flex items-center gap-2 mt-4">
                  <button
                    onClick={() => onOpenLineage({ 
                      action: 'create_from_asset',
                      assetId: asset.id,
                      selectedAssets: [asset]
                    })}
                    className="px-3 py-1.5 bg-purple-500 hover:bg-purple-600 text-white text-sm rounded-lg transition-colors flex items-center gap-1"
                    title="Create lineage from this asset"
                  >
                    🔗 Create Lineage
                  </button>
                  
                  <button
                    onClick={() => setShowRequestAccess(true)}
                    className="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-sm rounded-lg transition-colors"
                    data-testid="request-access-button"
                  >
                    Request Access
                  </button>
                </div>
              </div>
              {/* Upper Section: Compact Summary */}
              <div className="border-b pb-4">
                <div className="flex flex-wrap text-sm text-gray-700">
                  <div className="w-1/2 md:w-1/4 mb-2">
                    <span className="font-semibold">Type:</span> <span>{editMode ? (<input type="text" value={editableAsset.type || asset.type} onChange={(e) => setEditableAsset({ ...editableAsset, type: e.target.value })} className="ml-1 border rounded px-1 py-0.5 focus:outline-none" />) : asset.type}</span>
                  </div>
                  <div className="w-1/2 md:w-1/4 mb-2">
                    <span className="font-semibold">Business Area:</span> <span>{editMode ? (<input type="text" value={editableAsset.businessArea || asset.businessArea} onChange={(e) => setEditableAsset({ ...editableAsset, businessArea: e.target.value })} className="ml-1 border rounded px-1 py-0.5 focus:outline-none" />) : asset.businessArea}</span>
                  </div>
                  <div className="w-1/2 md:w-1/4 mb-2">
                    <span className="font-semibold">Owner:</span> <span>{editMode ? (<input type="text" value={editableAsset.owner} onChange={(e) => setEditableAsset({ ...editableAsset, owner: e.target.value })} className="ml-1 border rounded px-1 py-0.5 focus:outline-none" />) : asset.owner}</span>
                  </div>
                  <div className="w-1/2 md:w-1/4 mb-2">
                    <span className="font-semibold">Last Updated:</span> <span>{editMode ? (<input type="date" value={editableAsset.lastUpdated} onChange={(e) => setEditableAsset({ ...editableAsset, lastUpdated: e.target.value })} className="ml-1 border rounded px-1 py-0.5 focus:outline-none" />) : asset.lastUpdated}</span>
                  </div>
                </div>
              </div>
              <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <h3 className="text-sm font-semibold text-gray-700">KPIs</h3>
                  {editMode ? (
                    <div className="mt-1 space-y-2">
                      {(editableAsset.kpis || []).map((kpi, index) => (
                        <div key={index} className="grid grid-cols-3 gap-2">
                          <input type="text" placeholder="Metric" value={kpi.metric} onChange={(e) => updateKpi(index, 'metric', e.target.value)} className="border rounded px-2 py-1 focus:outline-none" />
                          <input type="text" placeholder="Value" value={kpi.value} onChange={(e) => updateKpi(index, 'value', e.target.value)} className="border rounded px-2 py-1 focus:outline-none" />
                          <select value={kpi.type} onChange={(e) => updateKpi(index, 'type', e.target.value)} className="border rounded px-2 py-1 focus:outline-none">
                            <option value="trendingUp">Trending Up</option>
                            <option value="dollarSign">Dollar Sign</option>
                            <option value="barChart">Bar Chart</option>
                            <option value="customer">Customer</option>
                            <option value="reporting">Reporting</option>
                            <option value="governance">Compliance</option>
                            <option value="dataQuality">Data Quality</option>
                            <option value="businessMetrics">Business Metrics</option>
                            <option value="target">Target</option>
                            <option value="regulatoryReporting">Regulatory Reporting</option>
                            <option value="mandatoryRequirements">Mandatory Requirements</option>
                            <option value="dataSecurity">Data Security</option>
                          </select>
                        </div>
                      ))}
                      <button onClick={addKpi} className="px-3 py-1 bg-blue-500 text-white rounded transition-colors text-sm">Add KPI</button>
                    </div>
                  ) : (
                    <div className="mt-1 space-y-1">
                      {(asset.kpis || []).map((kpi, idx) => (
                        <div key={idx} className="flex items-center text-sm font-semibold text-green-600 space-x-1">
                          {getKpiIcon(kpi.type)}
                          <span>{kpi.metric}: {kpi.value}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div>
                  <h3 className="text-sm font-semibold text-gray-700">Tags</h3>
                  {editMode ? (
                    <input type="text" value={(editableAsset.tags || []).join(', ')} onChange={(e) => setEditableAsset({ ...editableAsset, tags: e.target.value.split(',').map(t => t.trim()) })} className="mt-1 border rounded px-2 py-1 focus:outline-none" />
                  ) : (
                    <div className="mt-1 flex flex-wrap gap-1">
                      {asset.tags.map(tag => (
                        <span key={tag} className="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded">{tag}</span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
              <div className="mt-4">
                <h3 className="text-sm font-semibold text-gray-700">Additional Information</h3>
                {editMode ? (
                  <EditableAdditionalInfo asset={editableAsset} editable={true} onUpdate={setEditableAsset} />
                ) : (
                  <EditableAdditionalInfo asset={asset} editable={false} onUpdate={() => {}} />
                )}
              </div>
              {/* Save / Cancel Buttons for Edit Mode */}
              {editMode && (
                <div className="mt-4 flex justify-end space-x-2">
                  <button onClick={() => {
                    onAssetUpdate(editableAsset);
                    alert("Changes saved (demo).");
                  }} className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition-colors">Save Changes</button>
                  <button onClick={() => setEditableAsset({ ...asset })} className="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition-colors">Cancel</button>
                </div>
              )}
              {/* Tab Navigation */}
              <div className="mt-6 border-b border-gray-200">
                <nav className="flex space-x-2 md:space-x-8 overflow-x-auto">
                  <button
                    onClick={() => setActiveTab('overview')}
                    className={`py-2 px-2 md:px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${
                      activeTab === 'overview'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    Overview
                  </button>
                  <button
                    onClick={() => setActiveTab('components')}
                    className={`py-2 px-2 md:px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${
                      activeTab === 'components'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    Components
                  </button>
                  <button
                    onClick={() => setActiveTab('relationships')}
                    className={`py-2 px-2 md:px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${
                      activeTab === 'relationships'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    Relationships
                  </button>
                  <button
                    onClick={() => setActiveTab('schema')}
                    className={`py-2 px-2 md:px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${
                      activeTab === 'schema'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    Schema
                  </button>
                  <button
                    onClick={() => setActiveTab('compliance')}
                    className={`py-2 px-2 md:px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${
                      activeTab === 'compliance'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    Compliance
                  </button>
                  <button
                    onClick={() => setActiveTab('lineage')}
                    className={`py-2 px-2 md:px-1 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${
                      activeTab === 'lineage'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    Lineage
                  </button>
                </nav>
              </div>

              {/* Tab Content */}
              <div className="mt-6">
                {/* Overview Tab */}
                {activeTab === 'overview' && (
                  <div className="space-y-6">
                    <div>
                      <h3 className="text-xl font-semibold text-gray-900 mb-4">Overview</h3>
                      <div className="bg-gray-50 p-4 rounded">
                        <p className="text-gray-700 mb-2">
                          <span className="font-semibold">Description:</span> {asset.description}
                        </p>
                        <p className="text-gray-700 mb-2">
                          <span className="font-semibold">Business Purpose:</span> This asset serves as a key component in our data infrastructure.
                        </p>
                        <div className="mt-4">
                          <h4 className="font-semibold text-gray-800 mb-2">Quick Actions</h4>
                          <button onClick={() => setShowRequestAccess(true)} className="px-4 py-2 bg-indigo-500 text-white rounded hover:bg-indigo-600 transition-colors mr-2">
                            Request Access
                          </button>
                        </div>
                      </div>
                    </div>
                    <div>
                      <h3 className="text-xl font-semibold text-gray-900 mb-4">Embedded Content</h3>
                      {asset.embedItems && asset.embedItems.length > 0 ? (
                        <EmbedPanel items={asset.embedItems} />
                      ) : (
                        <div className="bg-gray-50 p-4 rounded">
                          <p className="text-gray-500 text-center">No embedded content available for this asset</p>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* Components Tab */}
                {activeTab === 'components' && (
                  <div>
                    <h3 className="text-xl font-semibold text-gray-900 mb-4">Components</h3>
                    {asset.components && asset.components.length > 0 ? (
                      <ColumnComponents asset={asset} editable={false} onUpdate={() => {}} />
                    ) : (
                      <div className="bg-gray-50 p-4 rounded">
                        <p className="text-gray-500 text-center">No components defined for this asset</p>
                      </div>
                    )}
                  </div>
                )}

                {/* Relationships Tab */}
                {activeTab === 'relationships' && (
                  <div>
                    <h3 className="text-xl font-semibold text-gray-900 mb-4">Linked Assets</h3>
                    {asset.linkedAssets && asset.linkedAssets.length > 0 ? (
                      <div className="space-y-4">
                        {asset.linkedAssets.map((linked, index) => (
                          <div key={index} className="p-4 border rounded cursor-pointer hover:shadow-md transition-shadow" onClick={() => onAssetSelect(linked)}>
                            <div className="flex items-center">
                              {getAssetIcon(linked.type || "Dataset")}
                              <span className="ml-2 font-semibold">{linked.name}</span>
                            </div>
                            <p className="text-gray-500 text-sm">{linked.description}</p>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="bg-gray-50 p-4 rounded">
                        <p className="text-gray-500 text-center">No linked assets for this asset</p>
                      </div>
                    )}
                  </div>
                )}

                {/* Schema Tab */}
                {activeTab === 'schema' && (
                  <div>
                    <h3 className="text-xl font-semibold text-gray-900 mb-4">Dataset Schema</h3>
                    {asset.type === "Dataset" || asset.schemaColumns ? (
                      <SchemaDisplay columns={asset.schemaColumns || SAMPLE_COLUMNS} criticalElements={CRITICAL_ELEMENTS} />
                    ) : (
                      <div className="bg-gray-50 p-4 rounded">
                        <p className="text-gray-500 text-center">No schema information available for this asset type</p>
                      </div>
                    )}
                  </div>
                )}

                {/* Compliance Tab */}
                {activeTab === 'compliance' && (
                  <div>
                    <h3 className="text-xl font-semibold text-gray-900 mb-4">Compliance & Regulations</h3>
                    <ComplianceSection asset={asset} setSelectedCompliance={setSelectedCompliance} />
                  </div>
                )}

                {/* Lineage Tab */}
                {activeTab === 'lineage' && (
                  <div>
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="text-xl font-semibold text-gray-900">Lineage Projects</h3>
                      <button
                        onClick={() => onOpenLineage({ assetId: asset.id })}
                        className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors text-sm"
                      >
                        🌊 Create Lineage
                      </button>
                    </div>
                    
                    {asset.lineageProjects && asset.lineageProjects.length > 0 ? (
                      <div className="space-y-3">
                        {asset.lineageProjects.map(project => (
                          <div key={project.id} className="border border-gray-200 rounded-lg p-4 hover:border-blue-300 transition-colors">
                            <div className="flex justify-between items-start">
                              <div>
                                <h4 className="font-medium text-gray-900">{project.name}</h4>
                                <p className="text-sm text-gray-600 mt-1">
                                  Last modified: {new Date(project.lastModified).toLocaleDateString()}
                                </p>
                              </div>
                              <button
                                onClick={() => {
                                  if (onOpenLineageProject) {
                                    onOpenLineageProject(project.id);
                                  } else {
                                    alert(`Opening lineage project: ${project.name}`);
                                  }
                                }}
                                className="px-3 py-1 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition-colors text-sm"
                              >
                                View Project
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="bg-gray-50 p-8 rounded-lg text-center">
                        <div className="text-4xl mb-3">🌊</div>
                        <h4 className="text-lg font-medium text-gray-900 mb-2">No Lineage Projects</h4>
                        <p className="text-gray-600 mb-4">
                          This asset is not referenced in any lineage projects yet.
                        </p>
                        <button
                          onClick={() => onOpenLineage({ assetId: asset.id })}
                          className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                        >
                          Create First Lineage Project
                        </button>
                      </div>
                    )}
                  </div>
                )}
                
                {/* Request Access Modal */}
                {showRequestAccess && <RequestAccessModal onClose={() => setShowRequestAccess(false)} />}
              </div>
            </div>
          </div>
        );
      };

      /**********************************************************************
       * BulkOperationsPanel Component – For batch operations on multiple assets
       **********************************************************************/
      const BulkOperationsPanel = ({ selectedAssets, onClose, onBulkUpdate, assets }) => {
        const [operationType, setOperationType] = React.useState('');
        const [bulkData, setBulkData] = React.useState({
          tags: '',
          addTags: true, // true = add tags, false = replace tags
          owner: '',
          ownerEmail: '',
          businessArea: '',
          classification: '',
          complianceCriticality: '',
          endorsed: false
        });
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [previewChanges, setPreviewChanges] = React.useState(false);

        const operationTypes = [
          { value: 'updateTags', label: 'Update Tags', description: 'Add or replace tags on selected assets' },
          { value: 'updateOwner', label: 'Update Owner', description: 'Change owner information' },
          { value: 'updateClassification', label: 'Update Classification', description: 'Change security classification' },
          { value: 'updateBusinessArea', label: 'Update Business Area', description: 'Change business area assignment' },
          { value: 'updateCompliance', label: 'Update Compliance', description: 'Change compliance criticality' },
          { value: 'updateEndorsement', label: 'Update Endorsement', description: 'Set endorsement status' }
        ];

        const getUniqueValues = (field) => {
          return [...new Set(assets.map(asset => asset[field]).filter(Boolean))];
        };

        const businessAreas = getUniqueValues('businessArea');
        const owners = getUniqueValues('owner');
        const classifications = ['Internal', 'Confidential', 'Highly Confidential'];
        const criticalities = ['Low', 'Medium', 'High'];

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!operationType) {
            alert('Please select an operation type');
            return;
          }

          setIsSubmitting(true);
          try {
            const updates = {};
            
            switch (operationType) {
              case 'updateTags':
                if (bulkData.tags.trim()) {
                  const newTags = bulkData.tags.split(',').map(tag => tag.trim()).filter(Boolean);
                  updates.tags = bulkData.addTags ? 'add' : 'replace';
                  updates.tagValues = newTags;
                }
                break;
              case 'updateOwner':
                if (bulkData.owner.trim()) {
                  updates.owner = bulkData.owner.trim();
                  if (bulkData.ownerEmail.trim()) {
                    updates.ownerEmail = bulkData.ownerEmail.trim();
                  }
                }
                break;
              case 'updateClassification':
                if (bulkData.classification) {
                  updates.classification = bulkData.classification;
                }
                break;
              case 'updateBusinessArea':
                if (bulkData.businessArea.trim()) {
                  updates.businessArea = bulkData.businessArea.trim();
                }
                break;
              case 'updateCompliance':
                if (bulkData.complianceCriticality) {
                  updates.complianceCriticality = bulkData.complianceCriticality;
                }
                break;
              case 'updateEndorsement':
                updates.endorsed = bulkData.endorsed;
                break;
            }

            await onBulkUpdate(selectedAssets, updates);
            onClose();
          } catch (error) {
            console.error('Bulk update error:', error);
            alert('Error updating assets. Please try again.');
          } finally {
            setIsSubmitting(false);
          }
        };

        const renderOperationForm = () => {
          switch (operationType) {
            case 'updateTags':
              return (
                <div className="space-y-4">
                  <div>
                    <label className="flex items-center space-x-2 mb-2">
                      <input
                        type="radio"
                        checked={bulkData.addTags}
                        onChange={() => setBulkData({...bulkData, addTags: true})}
                        className="text-blue-600"
                      />
                      <span className="text-sm font-medium">Add tags to existing tags</span>
                    </label>
                    <label className="flex items-center space-x-2">
                      <input
                        type="radio"
                        checked={!bulkData.addTags}
                        onChange={() => setBulkData({...bulkData, addTags: false})}
                        className="text-blue-600"
                      />
                      <span className="text-sm font-medium">Replace all existing tags</span>
                    </label>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Tags (comma-separated)</label>
                    <input
                      type="text"
                      value={bulkData.tags}
                      onChange={(e) => setBulkData({...bulkData, tags: e.target.value})}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="e.g., critical, customer-data, analytics"
                    />
                  </div>
                </div>
              );
            
            case 'updateOwner':
              return (
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Owner Name</label>
                    <input
                      type="text"
                      value={bulkData.owner}
                      onChange={(e) => setBulkData({...bulkData, owner: e.target.value})}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="Enter new owner name"
                      list="ownerSuggestions"
                    />
                    <datalist id="ownerSuggestions">
                      {owners.map(owner => (
                        <option key={owner} value={owner} />
                      ))}
                    </datalist>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Owner Email (optional)</label>
                    <input
                      type="email"
                      value={bulkData.ownerEmail}
                      onChange={(e) => setBulkData({...bulkData, ownerEmail: e.target.value})}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="owner@company.com"
                    />
                  </div>
                </div>
              );

            case 'updateClassification':
              return (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Classification Level</label>
                  <select
                    value={bulkData.classification}
                    onChange={(e) => setBulkData({...bulkData, classification: e.target.value})}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select classification...</option>
                    {classifications.map(classification => (
                      <option key={classification} value={classification}>{classification}</option>
                    ))}
                  </select>
                </div>
              );

            case 'updateBusinessArea':
              return (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Business Area</label>
                  <input
                    type="text"
                    value={bulkData.businessArea}
                    onChange={(e) => setBulkData({...bulkData, businessArea: e.target.value})}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter business area"
                    list="businessAreaSuggestions"
                  />
                  <datalist id="businessAreaSuggestions">
                    {businessAreas.map(area => (
                      <option key={area} value={area} />
                    ))}
                  </datalist>
                </div>
              );

            case 'updateCompliance':
              return (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Compliance Criticality</label>
                  <select
                    value={bulkData.complianceCriticality}
                    onChange={(e) => setBulkData({...bulkData, complianceCriticality: e.target.value})}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select criticality...</option>
                    {criticalities.map(criticality => (
                      <option key={criticality} value={criticality}>{criticality}</option>
                    ))}
                  </select>
                </div>
              );

            case 'updateEndorsement':
              return (
                <div>
                  <label className="flex items-center space-x-2">
                    <input
                      type="checkbox"
                      checked={bulkData.endorsed}
                      onChange={(e) => setBulkData({...bulkData, endorsed: e.target.checked})}
                      className="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                    />
                    <span className="text-sm font-medium text-gray-700">Mark selected assets as endorsed</span>
                  </label>
                </div>
              );

            default:
              return null;
          }
        };

        const getPreviewText = () => {
          if (!operationType) return 'Select an operation to see preview';
          
          const affectedCount = selectedAssets.length;
          const operationLabel = operationTypes.find(op => op.value === operationType)?.label || operationType;
          
          return `This will ${operationLabel.toLowerCase()} for ${affectedCount} selected asset${affectedCount === 1 ? '' : 's'}.`;
        };

        return (
          <div className="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" onClick={(e) => e.target === e.currentTarget && onClose()}>
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden">
              {/* Header */}
              <div className="bg-gradient-to-r from-purple-600 to-purple-700 px-6 py-4 text-white">
                <div className="flex items-center justify-between">
                  <div className="flex items-center">
                    <div className="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center mr-3">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                      </svg>
                    </div>
                    <div>
                      <h2 className="text-xl font-bold">Bulk Operations</h2>
                      <p className="text-purple-100 text-sm">{selectedAssets.length} asset{selectedAssets.length === 1 ? '' : 's'} selected</p>
                    </div>
                  </div>
                  <button 
                    onClick={onClose}
                    className="w-8 h-8 flex items-center justify-center rounded-lg bg-white bg-opacity-20 hover:bg-opacity-30 transition-colors"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                  </button>
                </div>
              </div>

              {/* Content */}
              <div className="overflow-y-auto max-h-[calc(90vh-100px)]">
                <form onSubmit={handleSubmit} className="p-6 space-y-6">
                  {/* Selected Assets Summary */}
                  <div className="bg-gray-50 rounded-lg p-4">
                    <h3 className="text-lg font-semibold text-gray-900 mb-3">Selected Assets ({selectedAssets.length})</h3>
                    <div className="max-h-32 overflow-y-auto">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                        {selectedAssets.map(asset => (
                          <div key={asset.id} className="flex items-center text-sm">
                            <span className="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                            <span className="font-medium text-gray-900">{asset.name}</span>
                            <span className="text-gray-500 ml-1">({asset.type})</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Operation Selection */}
                  <div>
                    <h3 className="text-lg font-semibold text-gray-900 mb-3">Select Operation</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {operationTypes.map(operation => (
                        <label key={operation.value} className={`cursor-pointer p-3 border rounded-lg transition-colors ${
                          operationType === operation.value
                            ? 'border-purple-500 bg-purple-50 text-purple-900'
                            : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                        }`}>
                          <input
                            type="radio"
                            name="operationType"
                            value={operation.value}
                            checked={operationType === operation.value}
                            onChange={(e) => setOperationType(e.target.value)}
                            className="sr-only"
                          />
                          <div className="font-medium text-sm">{operation.label}</div>
                          <div className="text-xs text-gray-600 mt-1">{operation.description}</div>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Operation Form */}
                  {operationType && (
                    <div>
                      <h3 className="text-lg font-semibold text-gray-900 mb-3">Configure Operation</h3>
                      <div className="bg-white border border-gray-200 rounded-lg p-4">
                        {renderOperationForm()}
                      </div>
                    </div>
                  )}

                  {/* Preview */}
                  <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h4 className="font-medium text-blue-900 mb-2">Preview</h4>
                    <p className="text-sm text-blue-800">{getPreviewText()}</p>
                  </div>

                  {/* Form Actions */}
                  <div className="flex justify-end space-x-3 pt-6 border-t">
                    <button
                      type="button"
                      onClick={onClose}
                      className="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isSubmitting || !operationType}
                      className="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                    >
                      {isSubmitting ? 'Applying Changes...' : 'Apply Changes'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        );
      };

      /**********************************************************************
       * Asset Card Component – Improved layout with Classification Icon and Selection.
       **********************************************************************/
      const AssetCard = ({ asset, onClick, isSelected, onSelectionChange, selectionMode }) => {
        const endRender = debug.trackRender('AssetCard');
        
        // Debug what props AssetCard is receiving
        React.useEffect(() => {
          console.log('🏷️ AssetCard props for', asset.name, ':', {
            selectionMode: selectionMode,
            isSelected: isSelected,
            hasOnClick: !!onClick,
            hasOnSelectionChange: !!onSelectionChange
          });
        }, [selectionMode, isSelected, onClick, onSelectionChange, asset.name]);
        
        const handleClick = React.useCallback((e) => {
          console.log('🔄 NEW CODE LOADED - Asset clicked:', asset.name, 'Mode:', selectionMode ? 'SELECTION' : 'NORMAL', 'Timestamp:', Date.now());
          
          // FIRST PRIORITY: Selection mode
          if (selectionMode === true) {
            console.log('✅ Selection mode active - calling selection handler');
            if (onSelectionChange) {
              onSelectionChange(asset);
            } else {
              console.log('❌ ERROR: onSelectionChange is not available');
            }
            return; // IMPORTANT: Return early to prevent other handlers
          }
          
          // SECOND PRIORITY: Normal mode - open modal
          if (onClick) {
            console.log('🔍 Normal mode - opening modal');
            onClick(asset);
          } else {
            console.log('⚠️ No onClick handler available');
          }
        }, [asset, onClick, onSelectionChange, selectionMode]);

        const handleCheckboxChange = React.useCallback((e) => {
          e.stopPropagation();
          if (onSelectionChange) {
            onSelectionChange(asset);
          }
        }, [asset, onSelectionChange]);

        React.useEffect(() => {
          endRender();
        });

        return (
        <div 
          onClick={handleClick} 
          className={`relative p-6 border rounded-2xl bg-white transition-all duration-300 cursor-pointer group focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 ${
            selectionMode 
              ? (isSelected 
                  ? 'border-blue-400 bg-gradient-to-br from-blue-50 to-blue-100 shadow-lg ring-2 ring-blue-300 scale-[1.02]' 
                  : 'border-gray-200 hover:border-blue-300 hover:bg-gradient-to-br hover:from-blue-50 hover:to-white hover:shadow-md hover:scale-[1.01]')
              : 'border-gray-200 hover:shadow-xl hover:border-blue-200 hover:scale-[1.02] shadow-sm'
          }`}
          role="button"
          tabIndex="0"
          aria-label={`${selectionMode ? 'Select' : 'View details for'} ${asset.name}. Type: ${asset.type}. Owner: ${asset.owner}. Last updated: ${asset.lastUpdated}`}
          onKeyDown={(e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              handleClick(e);
            }
          }}
          data-testid="asset-card"
        >
          {/* Selection Mode Overlay */}
          {selectionMode && (
            <div className="absolute inset-0 bg-blue-500 bg-opacity-5 rounded-xl pointer-events-none" />
          )}
          
          {/* Selection checkbox */}
          {selectionMode && (
            <div className="absolute top-3 left-3 z-10">
              <div className={`w-8 h-8 rounded-full flex items-center justify-center ${
                isSelected ? 'bg-blue-500' : 'bg-white border-2 border-gray-300'
              } shadow-sm`}>
                <input
                  type="checkbox"
                  checked={isSelected || false}
                  onChange={handleCheckboxChange}
                  className="sr-only"
                  aria-label={`Select ${asset.name}`}
                />
                {isSelected && (
                  <svg className="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                  </svg>
                )}
              </div>
            </div>
          )}
          
          {/* Selection Mode Instruction */}
          {selectionMode && !isSelected && (
            <div className="absolute top-3 left-12 z-10">
              <span className="text-xs text-blue-600 font-medium bg-white px-2 py-1 rounded shadow-sm">
                Click to select
              </span>
            </div>
          )}
          {/* Classification badge - top right */}
          <div className="absolute top-3 right-3">
            <div className="flex items-center space-x-1">
              {getClassificationIcon(asset.classification)}
              <span className="text-xs font-medium text-gray-600">{asset.classification || 'Internal'}</span>
            </div>
          </div>
          
          {/* Endorsed banner */}
          {asset.endorsed && (
            <div className="mb-3">
              <div className="inline-flex items-center bg-gradient-to-r from-blue-500 to-blue-600 text-white px-3 py-1 rounded-full text-xs font-medium shadow-md">
                <StarBadgeIcon className="w-3 h-3 mr-1" />
                Endorsed Asset
              </div>
            </div>
          )}
          
          {/* Main content area */}
          <div className="flex items-start space-x-4">
            {/* Asset icon with enhanced styling */}
            <div className="flex-shrink-0">
              <div className="p-3 bg-gradient-to-br from-gray-50 to-gray-100 rounded-lg border shadow-sm group-hover:from-blue-50 group-hover:to-blue-100 transition-all duration-300">
                {getAssetIcon(asset.type)}
              </div>
            </div>
            
            {/* Content section */}
            <div className="flex-1 min-w-0">
              {/* Title and description */}
              <div className="mb-3">
                <h3 className="font-bold text-lg text-gray-900 mb-1 group-hover:text-blue-900 transition-colors duration-200">{asset.name}</h3>
                <p className="text-sm text-gray-600 leading-relaxed line-clamp-2">{asset.description}</p>
              </div>
              
              {/* Meta information with better visual hierarchy */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3 text-xs">
                <div className="flex items-center text-gray-600">
                  <UserIcon className="w-4 h-4 mr-1.5 text-gray-400" />
                  <a href={`mailto:${asset.ownerEmail || "contact@example.com"}`} className="hover:text-blue-600 transition-colors font-medium">{asset.owner}</a>
                </div>
                <div className="flex items-center text-gray-600">
                  <CalendarIcon className="w-4 h-4 mr-1.5 text-gray-400" />
                  <span>{asset.lastUpdated}</span>
                </div>
              </div>
              
              {/* Business Area with improved styling */}
              <div className="mb-3">
                <span className="inline-flex items-center px-2.5 py-1 rounded-md bg-gray-100 text-xs font-medium text-gray-700">
                  {asset.businessArea}
                </span>
              </div>
              
              {/* Tags with enhanced design */}
              <div className="mb-3 flex flex-wrap gap-1.5">
                {asset.tags.slice(0, 3).map(tag => (
                  <span key={tag} className="px-2 py-1 bg-blue-50 text-blue-700 text-xs rounded-md font-medium border border-blue-200">
                    {tag}
                  </span>
                ))}
                {asset.tags.length > 3 && (
                  <span className="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-md font-medium">
                    +{asset.tags.length - 3} more
                  </span>
                )}
              </div>
              
              {/* KPIs with improved visual design */}
              {(asset.kpis || []).length > 0 && (
                <div className="pt-2 border-t border-gray-100">
                  <div className="space-y-1.5">
                    {(asset.kpis || []).slice(0, 2).map((kpi, idx) => (
                      <div key={idx} className="flex items-center text-sm">
                        <div className="flex items-center space-x-1.5">
                          <div className="p-1 bg-green-100 rounded">
                            {getKpiIcon(kpi.type)}
                          </div>
                          <span className="font-medium text-gray-700">{kpi.metric}:</span>
                          <span className="font-bold text-green-700">{kpi.value}</span>
                        </div>
                      </div>
                    ))}
                    {(asset.kpis || []).length > 2 && (
                      <div className="text-xs text-gray-500 font-medium">
                        +{asset.kpis.length - 2} more metrics
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
        );
      };

      /**********************************************************************
       * FilterSidebar Component – Using h-full for full height.
       **********************************************************************/
      const FilterSidebar = ({ typeOptions, businessAreaOptions, tagOptions, selectedTypeFilters, setSelectedTypeFilters, selectedBusinessFilters, setSelectedBusinessFilters, selectedTagFilters, toggleTagFilter, dateFrom, setDateFrom, dateTo, setDateTo }) => (
        <aside className="w-72 bg-white border-r border-gray-200 shadow-sm h-full overflow-y-auto">
          <div className="p-6 space-y-6">
            {/* Filters Header */}
            <div className="pb-4 border-b border-gray-200">
              <h2 className="text-lg font-semibold text-gray-900 flex items-center">
                <svg className="w-5 h-5 mr-2 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.414A1 1 0 013 6.707V4z"/>
                </svg>
                Filters
              </h2>
              <p className="text-sm text-gray-500 mt-1">Refine your asset search</p>
            </div>

            {/* Asset Type Filter */}
            <div className="space-y-3">
              <div className="flex items-center">
                <svg className="w-4 h-4 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
                <h3 className="font-medium text-gray-900">Asset Type</h3>
              </div>
              <div className="space-y-2 pl-6">
                {Object.entries(typeOptions).map(([key, label]) => (
                  <label key={key} className="flex items-center group cursor-pointer">
                    <input 
                      type="checkbox" 
                      checked={selectedTypeFilters[key]} 
                      onChange={() => setSelectedTypeFilters(prev => ({ ...prev, [key]: !prev[key] }))} 
                      className="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2" 
                    />
                    <span className="ml-3 text-sm text-gray-700 group-hover:text-gray-900">{label}</span>
                  </label>
                ))}
              </div>
            </div>
            
            {/* Business Area Filter */}
            <div className="space-y-3">
              <div className="flex items-center">
                <svg className="w-4 h-4 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
                <h3 className="font-medium text-gray-900">Business Area</h3>
              </div>
              <div className="space-y-2 pl-6">
                {Object.entries(businessAreaOptions).map(([key, label]) => (
                  <label key={key} className="flex items-center group cursor-pointer">
                    <input 
                      type="checkbox" 
                      checked={selectedBusinessFilters[key]} 
                      onChange={() => setSelectedBusinessFilters(prev => ({ ...prev, [key]: !prev[key] }))} 
                      className="w-4 h-4 text-green-600 bg-gray-100 border-gray-300 rounded focus:ring-green-500 focus:ring-2" 
                    />
                    <span className="ml-3 text-sm text-gray-700 group-hover:text-gray-900">{label}</span>
                  </label>
                ))}
              </div>
            </div>
            
            {/* Tags Filter */}
            <div className="space-y-3">
              <div className="flex items-center">
                <svg className="w-4 h-4 mr-2 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                </svg>
                <h3 className="font-medium text-gray-900">Tags</h3>
              </div>
              <div className="flex flex-wrap gap-2 pl-6">
                {Object.entries(tagOptions).map(([key, label]) => {
                  const isSelected = selectedTagFilters[key];
                  return (
                    <button 
                      key={key} 
                      onClick={() => toggleTagFilter(key)} 
                      className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 ${
                        isSelected 
                          ? "bg-purple-600 text-white shadow-md focus:ring-purple-500" 
                          : "bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300 focus:ring-gray-500"
                      }`}
                    >
                      {label}
                    </button>
                  );
                })}
              </div>
            </div>
            
            {/* Date Range Filter */}
            <div className="space-y-3">
              <div className="flex items-center">
                <svg className="w-4 h-4 mr-2 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <h3 className="font-medium text-gray-900">Date Range</h3>
              </div>
              <div className="space-y-3 pl-6">
                <div>
                  <label className="block text-xs font-medium text-gray-700 mb-1">From Date</label>
                  <input 
                    type="date" 
                    value={dateFrom} 
                    onChange={(e) => setDateFrom(e.target.value)} 
                    className="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent" 
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-700 mb-1">To Date</label>
                  <input 
                    type="date" 
                    value={dateTo} 
                    onChange={(e) => setDateTo(e.target.value)} 
                    className="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent" 
                  />
                </div>
              </div>
            </div>
          </div>
        </aside>
      );

      /**********************************************************************
       * Header Component – Top navigation with responsive container.
       **********************************************************************/
      const Header = ({ searchQuery, setSearchQuery, viewMode, setViewMode, editMode, toggleEditMode, onOpenLineage }) => (
        <header className="sticky top-0 z-10 bg-gradient-to-r from-blue-600 to-blue-700 shadow-lg">
          <div className="container mx-auto px-6 py-4">
            <div className="flex items-center justify-between">
              {/* Logo and Brand */}
              <div className="flex items-center">
                <div className="w-12 h-12 bg-white bg-opacity-20 rounded-lg flex items-center justify-center mr-4 backdrop-blur-sm">
                  <svg className="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                  </svg>
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-white">Data Catalogue</h1>
                  <p className="text-blue-100 text-sm hidden sm:block">Asset & Compliance Management</p>
                </div>
              </div>

              {/* Search Bar */}
              <div className="flex-1 mx-6 max-w-2xl">
                <div className="relative">
                  <SearchIcon className="absolute left-3 top-2.5 text-gray-400" />
                  <input 
                    type="text" 
                    placeholder="Search assets, compliance, owners..." 
                    className="w-full pl-10 pr-4 py-3 bg-white/95 backdrop-blur-sm border-0 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white focus:shadow-md transition-all duration-200 placeholder-gray-500 text-gray-900 font-medium" 
                    value={searchQuery} 
                    onChange={(e) => setSearchQuery(e.target.value)} 
                    aria-label="Search data assets" 
                    data-testid="search-input" 
                  />
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center space-x-3">
                <div className="flex items-center bg-white/20 rounded-xl p-1 backdrop-blur-sm shadow-sm">
                  <button 
                    onClick={() => setViewMode("grid")} 
                    className={`p-2.5 rounded-lg transition-all duration-200 ${
                      viewMode === "grid" 
                        ? "bg-white text-blue-600 shadow-md scale-105" 
                        : "text-white hover:bg-white/30 hover:scale-105"
                    }`} 
                    title="Grid View" 
                    data-testid="grid-view-button"
                  >
                    <LayoutGridIcon />
                  </button>
                  <button 
                    onClick={() => setViewMode("list")} 
                    className={`p-2.5 rounded-lg transition-all duration-200 ${
                      viewMode === "list" 
                        ? "bg-white text-blue-600 shadow-md scale-105" 
                        : "text-white hover:bg-white/30 hover:scale-105"
                    }`} 
                    title="List View" 
                    data-testid="list-view-button"
                  >
                    <ListIcon />
                  </button>
                </div>
                
                <button 
                  onClick={() => onOpenLineage({ action: 'create_project' })}
                  className="px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 bg-purple-500 hover:bg-purple-600 text-white shadow-md"
                  title="Create Process Lineage"
                  data-testid="create-lineage-button"
                >
                  🔗 Create Lineage
                </button>
                
                <button 
                  onClick={toggleEditMode} 
                  className={`px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 ${
                    editMode 
                      ? "bg-red-500 hover:bg-red-600 text-white shadow-md"
