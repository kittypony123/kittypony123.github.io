                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // Variable Linking Modal Component
      const VariableLinkingModal = ({ onClose, assets, manualLinks, onSaveLinks }) => {
        const [selectedVariables, setSelectedVariables] = React.useState([]);
        const [displayName, setDisplayName] = React.useState('');
        const [step, setStep] = React.useState(1); // 1: select variables, 2: configure link
        
        const allVariables = VariableAnalyzer.extractVariables(assets);
        const linkableVariables = VariableAnalyzer.getLinkableVariables(allVariables, manualLinks);
        
        const handleVariableToggle = (variable) => {
          const variableId = VariableAnalyzer.getVariableId(variable);
          setSelectedVariables(prev => {
            const isSelected = prev.some(v => VariableAnalyzer.getVariableId(v) === variableId);
            if (isSelected) {
              return prev.filter(v => VariableAnalyzer.getVariableId(v) !== variableId);
            } else {
              return [...prev, variable];
            }
          });
        };
        
        const handleCreateLink = () => {
          if (selectedVariables.length < 2) return;
          
          const newLink = {
            groupId: Date.now().toString(),
            displayName: displayName || selectedVariables[0].name,
            variableIds: selectedVariables.map(v => VariableAnalyzer.getVariableId(v)),
            createdAt: new Date().toISOString(),
            description: `Manually linked ${selectedVariables.length} variables`
          };
          
          const updatedLinks = [...manualLinks, newLink];
          onSaveLinks(updatedLinks);
          onClose();
        };
        
        const handleDeleteLink = (groupId) => {
          const updatedLinks = manualLinks.filter(link => link.groupId !== groupId);
          onSaveLinks(updatedLinks);
        };
        
        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-lg shadow-xl max-w-6xl w-full max-h-[90vh] overflow-hidden">
              <div className="flex items-center justify-between p-6 border-b">
                <div>
                  <h2 className="text-2xl font-bold text-gray-900">🔗 Variable Linking</h2>
                  <p className="text-gray-600">Create manual relationships between variables</p>
                </div>
                <button 
                  onClick={onClose}
                  className="text-gray-400 hover:text-gray-600 text-2xl font-bold"
                >
                  ×
                </button>
              </div>
              
              <div className="p-6 overflow-y-auto max-h-[70vh]">
                {step === 1 && (
                  <>
                    {/* Existing Manual Links */}
                    {manualLinks.length > 0 && (
                      <div className="mb-8">
                        <h3 className="text-lg font-semibold text-gray-900 mb-4">Existing Variable Links</h3>
                        <div className="space-y-3">
                          {manualLinks.map(link => (
                            <div key={link.groupId} className="bg-gray-50 rounded-lg p-4">
                              <div className="flex items-start justify-between">
                                <div className="flex-1">
                                  <h4 className="font-medium text-gray-900">{link.displayName}</h4>
                                  <p className="text-sm text-gray-600 mt-1">{link.description}</p>
                                  <div className="flex flex-wrap gap-1 mt-2">
                                    {link.variableIds.map((variableId, index) => {
                                      const variable = allVariables.find(v => VariableAnalyzer.getVariableId(v) === variableId);
                                      return variable ? (
                                        <span key={index} className="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">
                                          {variable.name}
                                        </span>
                                      ) : (
                                        <span key={index} className="inline-block bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs">
                                          {variableId}
                                        </span>
                                      );
                                    })}
                                  </div>
                                </div>
                                <button
                                  onClick={() => handleDeleteLink(link.groupId)}
                                  className="ml-4 text-red-600 hover:text-red-800 font-medium text-sm"
                                >
                                  Remove
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    {/* Variable Selection */}
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="text-lg font-semibold text-gray-900">
                          Select Variables to Link ({selectedVariables.length} selected)
                        </h3>
                        <button
                          onClick={() => setStep(2)}
                          disabled={selectedVariables.length < 2}
                          className={`px-4 py-2 rounded font-medium ${
                            selectedVariables.length >= 2
                              ? 'bg-blue-600 text-white hover:bg-blue-700'
                              : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                          }`}
                        >
                          Configure Link →
                        </button>
                      </div>
                      
                      <div className="grid grid-cols-1 gap-3 max-h-96 overflow-y-auto">
                        {linkableVariables.map((variable, index) => {
                          const variableId = VariableAnalyzer.getVariableId(variable);
                          const isSelected = selectedVariables.some(v => VariableAnalyzer.getVariableId(v) === variableId);
                          
                          return (
                            <div
                              key={index}
                              className={`border rounded-lg p-4 cursor-pointer transition-colors ${
                                isSelected 
                                  ? 'border-blue-500 bg-blue-50' 
                                  : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                              }`}
                              onClick={() => handleVariableToggle(variable)}
                            >
                              <div className="flex items-start justify-between">
                                <div className="flex-1">
                                  <div className="flex items-center space-x-2">
                                    <input
                                      type="checkbox"
                                      checked={isSelected}
                                      onChange={() => handleVariableToggle(variable)}
                                      className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                                    />
                                    <h4 className="font-medium text-gray-900">{variable.name}</h4>
                                    <span className="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs">
                                      {variable.assetCount} asset{variable.assetCount !== 1 ? 's' : ''}
                                    </span>
                                  </div>
                                  
                                  <div className="mt-2 text-sm text-gray-600">
                                    <div className="flex space-x-4">
                                      <span>Types: {Array.from(variable.types).join(', ')}</span>
                                      <span>Assets: {variable.occurrences.slice(0, 2).map(o => o.assetName).join(', ')}</span>
                                      {variable.occurrences.length > 2 && (
                                        <span>+{variable.occurrences.length - 2} more</span>
                                      )}
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </>
                )}
                
                {step === 2 && (
                  <div>
                    <div className="mb-6">
                      <button
                        onClick={() => setStep(1)}
                        className="text-blue-600 hover:text-blue-800 font-medium text-sm mb-4"
                      >
                        ← Back to Selection
                      </button>
                      
                      <h3 className="text-lg font-semibold text-gray-900 mb-4">Configure Variable Link</h3>
                      
                      <div className="bg-blue-50 rounded-lg p-4 mb-6">
                        <h4 className="font-medium text-blue-900 mb-2">Selected Variables ({selectedVariables.length})</h4>
                        <div className="flex flex-wrap gap-2">
                          {selectedVariables.map((variable, index) => (
                            <span key={index} className="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">
                              {variable.name} ({variable.assetCount} assets)
                            </span>
                          ))}
                        </div>
                      </div>
                      
                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Display Name for Linked Variable
                          </label>
                          <input
                            type="text"
                            value={displayName}
                            onChange={(e) => setDisplayName(e.target.value)}
                            placeholder={selectedVariables[0]?.name || 'Enter display name'}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          />
                          <p className="text-xs text-gray-500 mt-1">
                            This name will be used to represent all linked variables
                          </p>
                        </div>
                        
                        <div className="flex justify-end space-x-3">
                          <button
                            onClick={() => setStep(1)}
                            className="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50"
                          >
                            Cancel
                          </button>
                          <button
                            onClick={handleCreateLink}
                            className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                          >
                            Create Link
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      const App = () => {
        const [mainTab, setMainTab] = React.useState("assets");
        const [searchQuery, setSearchQuery] = React.useState("");
        const [viewMode, setViewMode] = React.useState("grid");
        const [editMode, setEditMode] = React.useState(false);
        const toggleEditMode = () => setEditMode(prev => !prev);
        const [selectedTypeFilters, setSelectedTypeFilters] = React.useState({
          Dataset: false,
          Dashboard: false,
          Report: false,
          "Data Procedures": false
        });
        const [selectedBusinessFilters, setSelectedBusinessFilters] = React.useState({
          Customers: false,
          Assets: false,
          Finance: false,
          Operations: false
        });
        const [selectedTagFilters, setSelectedTagFilters] = React.useState({});
        const [dateFrom, setDateFrom] = React.useState("");
        const [dateTo, setDateTo] = React.useState("");
        const [sortOption, setSortOption] = React.useState("name-asc");
        const [currentPage, setCurrentPage] = React.useState(1);
        const pageSize = CONFIG.PAGINATION_SIZE;
        const [assets, setAssets] = useLocalStorage('catalogueAssets', initialAssetsData);
        const [selectedAsset, setSelectedAsset] = React.useState(null);
        const [selectedCompliance, setSelectedCompliance] = React.useState(null);
        const [showAssetImportForm, setShowAssetImportForm] = React.useState(false);
        const [showComplianceImportForm, setShowComplianceImportForm] = React.useState(false);
        
        // Bulk operations state
        const [selectionMode, setSelectionMode] = React.useState(false);
        const [selectedAssetIds, setSelectedAssetIds] = React.useState(new Set());
        const [showBulkOperationsPanel, setShowBulkOperationsPanel] = React.useState(false);
        
        // Variables view state
        const [selectedVariable, setSelectedVariable] = React.useState(null);
        const [variableSearchQuery, setVariableSearchQuery] = React.useState('');
        const [variableFilter, setVariableFilter] = React.useState('all'); // all, cross-asset, high-sensitivity, inconsistent
        const [showVariableLinkingModal, setShowVariableLinkingModal] = React.useState(false);
        const [manualVariableLinks, setManualVariableLinks] = useLocalStorage('manualVariableLinks', []);
        
        // Lineage view state
        const [lineageProjects, setLineageProjects] = useLocalStorage('lineageProjects', []);
        const [selectedLineageProject, setSelectedLineageProject] = React.useState(null);
        const [lineageActiveTab, setLineageActiveTab] = React.useState('general');
        const [currentLineageData, setCurrentLineageData] = React.useState({
          general: { projectName: '', businessPurpose: '', dataOwner: '' },
          sources: [],
          processing: {},
          intermediate: [],
          outputs: [],
          metadata: {
            created: new Date().toISOString(),
            lastModified: new Date().toISOString(),
            version: "2.0",
            title: "Data Lineage Documentation"
          }
        });
        
        
        const debouncedSearchQuery = useOptimizedDebounce(searchQuery, CONFIG.DEBOUNCE_DELAY);
        const handleLinkedAssetSelect = (linked) => {
          const fullAsset = assets.find(a => a.id === linked.id);
          setSelectedAsset(fullAsset || linked);
        };
        
        const handleAssetAdd = (newAsset) => {
          setAssets(prevAssets => [...prevAssets, newAsset]);
        };
        
        const handleComplianceAdd = (newCompliance) => {
          // Add to COMPLIANCE_REGISTRY
          COMPLIANCE_REGISTRY[newCompliance.complianceID] = newCompliance;
        };
        
        const handleCreateAsset = (newAssetData) => {
          const newAsset = {
            id: Date.now(),
            ...newAssetData,
            lastUpdated: new Date().toISOString().split('T')[0],
            tags: newAssetData.tags || [],
            additionalInfo: {},
            kpis: [],
            endorsed: false,
            classification: 'Internal',
            lineageProjects: [] // Track which lineage projects reference this asset
          };
          
          setAssets(prevAssets => [...prevAssets, newAsset]);
          return newAsset;
        };

        // Create bidirectional links between assets and lineage projects
        const updateAssetLineageLinks = (lineageProject) => {
          const projectId = lineageProject.id;
          const projectName = lineageProject.data?.general?.projectName || 'Untitled Project';
          
          // Find all asset IDs referenced in this lineage project
          const referencedAssetIds = new Set();
          
          // Check sources
          lineageProject.data?.sources?.forEach(source => {
            if (source.assetId) {
              // Convert to string to ensure consistent comparison
              referencedAssetIds.add(String(source.assetId));
            }
          });
          
          // Check outputs
          lineageProject.data?.outputs?.forEach(output => {
            if (output.assetId) {
              // Convert to string to ensure consistent comparison
              referencedAssetIds.add(String(output.assetId));
            }
          });
          
          // Update assets to include this lineage project in their references
          setAssets(prevAssets => prevAssets.map(asset => {
            if (referencedAssetIds.has(String(asset.id))) {
              // Add this project to the asset's lineage projects list
              const existingProjects = asset.lineageProjects || [];
              const updatedProjects = existingProjects.filter(p => p.id !== projectId);
              updatedProjects.push({
                id: projectId,
                name: projectName,
                lastModified: lineageProject.data?.metadata?.lastModified || new Date().toISOString()
              });
              
              return { ...asset, lineageProjects: updatedProjects };
            } else {
              // Remove this project from the asset's lineage projects list if it exists
              const existingProjects = asset.lineageProjects || [];
              const updatedProjects = existingProjects.filter(p => p.id !== projectId);
              
              return updatedProjects.length !== existingProjects.length 
                ? { ...asset, lineageProjects: updatedProjects }
                : asset;
            }
          }));
        };
        
        // Lineage handlers
        const handleOpenLineage = (context = {}) => {
          // Switch to lineage tab and create new project if needed
          setMainTab('lineage');
          
          if (context.assetId || context.selectedAssets) {
            // Create new project with asset context
            const selectedAssets = context.selectedAssets || 
                                  (context.assetId ? [assets.find(a => a.id === context.assetId)] : [])
                                  .filter(Boolean);
            
            const newProject = {
              id: Date.now(),
              name: selectedAssets.length > 0 ? `Lineage for ${selectedAssets[0].name}` : 'New Lineage Project',
              created: new Date().toISOString(),
              data: {
                general: { 
                  projectName: selectedAssets.length > 0 ? `Lineage for ${selectedAssets[0].name}` : '', 
                  businessPurpose: selectedAssets.length > 0 ? `Data lineage mapping for ${selectedAssets[0].name}` : '',
                  dataOwner: selectedAssets.length > 0 ? selectedAssets[0].owner : ''
                },
                sources: selectedAssets.map(asset => ({
                  id: Date.now() + Math.random(),
                  name: asset.name,
                  type: asset.type.toLowerCase(),
                  description: asset.description || '',
                  location: `Catalog Asset: ${asset.name}`,
                  assetId: asset.id,
                  isFromCatalog: true
                })),
                processing: {},
                intermediate: [],
                outputs: [],
                metadata: {
                  created: new Date().toISOString(),
                  lastModified: new Date().toISOString(),
                  version: "2.0",
                  title: "Data Lineage Documentation"
                }
              }
            };
            setCurrentLineageData(newProject.data);
            setSelectedLineageProject(newProject);
            setLineageActiveTab('general');
            
            // Save the project to lineage projects list
            setLineageProjects(prevProjects => [...prevProjects, newProject]);
            
            // Create bidirectional links immediately
            updateAssetLineageLinks(newProject);
          }
        };
        
        const handleOpenLineageProject = (projectId) => {
          // Find the project by ID
          const project = lineageProjects.find(p => p.id === projectId);
          if (project) {
            // Switch to lineage tab
            setMainTab('lineage');
            // Set the project as selected and load its data
            setSelectedLineageProject(project);
            setCurrentLineageData(project.data);
            setLineageActiveTab('general');
            // Close asset detail panel
            setSelectedAsset(null);
          } else {
            alert('Lineage project not found');
          }
        };
        
        const handleExportComplianceReport = () => {
          // Generate compliance report
          const complianceData = Object.values(COMPLIANCE_REGISTRY || {}).map(compliance => {
            const linkedAssets = (compliance.linkedAssetIDs || [])
              .map(assetId => {
                const asset = assets.find(a => a.id.toString() === assetId.toString());
                return asset ? asset.name : `Asset ${assetId}`;
              });
            
            return {
              complianceID: compliance.complianceID,
              title: compliance.title,
              description: compliance.description,
              regulatoryBody: compliance.regulatoryBody,
              effectiveDate: compliance.effectiveDate,
              reviewFrequency: compliance.reviewFrequency,
              criticality: compliance.criticality || 'Medium',
              status: compliance.status || 'Active',
              linkedAssetsCount: linkedAssets.length,
              linkedAssets: linkedAssets.join('; '),
              requirements: (compliance.requirements || []).join('; '),
              evidence: (compliance.evidence || []).join('; ')
            };
          });
          
          // Create Excel workbook
          const ws = XLSX.utils.json_to_sheet(complianceData);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Compliance Report");
          
          // Add summary sheet
          const summaryData = [
            { Metric: 'Total Requirements', Value: complianceData.length },
            { Metric: 'Active Requirements', Value: complianceData.filter(c => c.status === 'Active').length },
            { Metric: 'High Criticality', Value: complianceData.filter(c => c.criticality === 'High').length },
            { Metric: 'Assets with Compliance', Value: assets.filter(asset => 
              Object.values(COMPLIANCE_REGISTRY || {}).some(comp => 
                (comp.linkedAssetIDs || []).includes(asset.id.toString())
              )
            ).length }
          ];
          const summaryWs = XLSX.utils.json_to_sheet(summaryData);
          XLSX.utils.book_append_sheet(wb, summaryWs, "Summary");
          
          // Download
          const timestamp = new Date().toISOString().slice(0, 10);
          XLSX.writeFile(wb, `compliance-report-${timestamp}.xlsx`);
          
          alert('Compliance report exported successfully!');
        };
        
        const handleScheduleReview = () => {
          // Create review schedule based on compliance requirements
          const reviewData = Object.values(COMPLIANCE_REGISTRY || {}).map(compliance => {
            const effectiveDate = new Date(compliance.effectiveDate || Date.now());
            let nextReviewDate = new Date(effectiveDate);
            
            // Calculate next review date based on frequency
            switch(compliance.reviewFrequency) {
              case 'Quarterly':
                nextReviewDate.setMonth(nextReviewDate.getMonth() + 3);
                break;
              case 'Semi-Annual':
                nextReviewDate.setMonth(nextReviewDate.getMonth() + 6);
                break;
              case 'Annual':
                nextReviewDate.setFullYear(nextReviewDate.getFullYear() + 1);
                break;
              default:
                nextReviewDate.setFullYear(nextReviewDate.getFullYear() + 1);
            }
            
            return {
              complianceID: compliance.complianceID,
              title: compliance.title,
              regulatoryBody: compliance.regulatoryBody,
              criticality: compliance.criticality || 'Medium',
              reviewFrequency: compliance.reviewFrequency,
              effectiveDate: compliance.effectiveDate,
              nextReviewDate: nextReviewDate.toISOString().slice(0, 10),
              daysUntilReview: Math.ceil((nextReviewDate - new Date()) / (1000 * 60 * 60 * 24)),
              linkedAssetsCount: (compliance.linkedAssetIDs || []).length
            };
          }).sort((a, b) => new Date(a.nextReviewDate) - new Date(b.nextReviewDate));
          
          // Create Excel workbook
          const ws = XLSX.utils.json_to_sheet(reviewData);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Review Schedule");
          
          // Add overdue/upcoming reviews
          const upcomingReviews = reviewData.filter(r => r.daysUntilReview <= 90 && r.daysUntilReview > 0);
          const overdueReviews = reviewData.filter(r => r.daysUntilReview < 0);
          
          if (upcomingReviews.length > 0) {
            const upcomingWs = XLSX.utils.json_to_sheet(upcomingReviews);
            XLSX.utils.book_append_sheet(wb, upcomingWs, "Upcoming Reviews");
          }
          
          if (overdueReviews.length > 0) {
            const overdueWs = XLSX.utils.json_to_sheet(overdueReviews);
            XLSX.utils.book_append_sheet(wb, overdueWs, "Overdue Reviews");
          }
          
          // Download
          const timestamp = new Date().toISOString().slice(0, 10);
          XLSX.writeFile(wb, `compliance-review-schedule-${timestamp}.xlsx`);
          
          alert(`Review schedule exported! ${upcomingReviews.length} upcoming reviews, ${overdueReviews.length} overdue.`);
        };

        // Bulk operations handlers
        const toggleSelectionMode = () => {
          console.log('=== Toggling Selection Mode ===');
          console.log('Current selectionMode:', selectionMode);
          setSelectionMode(prev => {
            console.log('Setting selectionMode to:', !prev);
            return !prev;
          });
          setSelectedAssetIds(new Set());
          console.log('Selection cleared');
          console.log('==============================');
        };

        const handleAssetSelection = (asset) => {
          console.log('=== Asset Selection Handler ===');
          console.log('Asset being selected/deselected:', asset.name);
          console.log('Asset ID:', asset.id);
          setSelectedAssetIds(prev => {
            const newSet = new Set(prev);
            if (newSet.has(asset.id)) {
              console.log('Deselecting asset');
              newSet.delete(asset.id);
            } else {
              console.log('Selecting asset');
              newSet.add(asset.id);
            }
            console.log('New selected IDs:', Array.from(newSet));
            console.log('==============================');
            return newSet;
          });
        };

        const selectAllAssets = () => {
          const allIds = new Set(filteredAssets.map(asset => asset.id));
          setSelectedAssetIds(allIds);
        };

        const clearSelection = () => {
          setSelectedAssetIds(new Set());
        };

        const getSelectedAssets = () => {
          return assets.filter(asset => selectedAssetIds.has(asset.id));
        };

        const handleBulkUpdate = async (selectedAssets, updates) => {
          const updatedAssets = assets.map(asset => {
            if (selectedAssetIds.has(asset.id)) {
              const updatedAsset = { ...asset };
              
              // Apply updates based on operation type
              Object.keys(updates).forEach(key => {
                switch (key) {
                  case 'tags':
                    if (updates.tags === 'add') {
                      updatedAsset.tags = [...(updatedAsset.tags || []), ...updates.tagValues].filter((tag, index, arr) => arr.indexOf(tag) === index);
                    } else if (updates.tags === 'replace') {
                      updatedAsset.tags = updates.tagValues;
                    }
                    break;
                  case 'owner':
                  case 'ownerEmail':
                  case 'businessArea':
                  case 'classification':
                  case 'complianceCriticality':
                  case 'endorsed':
                    updatedAsset[key] = updates[key];
                    break;
                }
              });
              
              return updatedAsset;
            }
            return asset;
          });

          setAssets(updatedAssets);
          setSelectedAssetIds(new Set());
          setSelectionMode(false);
          setShowBulkOperationsPanel(false);
          
          // Show success message
          alert(`Successfully updated ${selectedAssets.length} asset${selectedAssets.length === 1 ? '' : 's'}`);
        };
        const toggleTagFilter = React.useCallback(tag => {
          setSelectedTagFilters(prev => ({ ...prev, [tag]: !prev[tag] }));
        }, []);
        const filteredAssets = React.useMemo(() => {
          let filtered = assets.filter(asset => {
            const lowerQuery = debouncedSearchQuery.toLowerCase();
            const matchesSearch =
              asset.name.toLowerCase().includes(lowerQuery) ||
              asset.description.toLowerCase().includes(lowerQuery) ||
              asset.type.toLowerCase().includes(lowerQuery) ||
              asset.businessArea.toLowerCase().includes(lowerQuery) ||
              asset.tags.some(tag => tag.toLowerCase().includes(lowerQuery));
            const activeTypeFilters = Object.entries(selectedTypeFilters).filter(([_, value]) => value).map(([key]) => key);
            const matchesType = activeTypeFilters.length === 0 || activeTypeFilters.includes(asset.type);
            const activeBusinessFilters = Object.entries(selectedBusinessFilters).filter(([_, value]) => value).map(([key]) => key);
            const matchesBusiness = activeBusinessFilters.length === 0 || activeBusinessFilters.includes(asset.businessArea);
            const activeTagFilters = Object.entries(selectedTagFilters).filter(([_, value]) => value).map(([key]) => key);
            const matchesTags = activeTagFilters.length === 0 || asset.tags.some(tag => activeTagFilters.includes(tag));
            const assetDate = new Date(asset.lastUpdated);
            const fromDate = dateFrom ? new Date(dateFrom) : null;
            const toDate = dateTo ? new Date(dateTo) : null;
            const matchesFrom = fromDate ? assetDate >= fromDate : true;
            const matchesTo = toDate ? assetDate <= toDate : true;
            return matchesSearch && matchesType && matchesBusiness && matchesTags && matchesFrom && matchesTo;
          });
          filtered.sort((a, b) => {
            if (sortOption === "endorsed") {
              if (a.endorsed === b.endorsed) return a.name.localeCompare(b.name);
              return a.endorsed ? -1 : 1;
            } else if (sortOption === "name-asc") {
              return a.name.localeCompare(b.name);
            } else if (sortOption === "name-desc") {
              return b.name.localeCompare(a.name);
            } else if (sortOption === "lastUpdated-asc") {
              return new Date(a.lastUpdated) - new Date(b.lastUpdated);
            } else if (sortOption === "lastUpdated-desc") {
              return new Date(b.lastUpdated) - new Date(a.lastUpdated);
            } else {
              return 0;
            }
          });
          return filtered;
        }, [assets, debouncedSearchQuery, selectedTypeFilters, selectedBusinessFilters, selectedTagFilters, dateFrom, dateTo, sortOption]);
        const paginatedAssets = React.useMemo(() => {
          const start = (currentPage - 1) * pageSize;
          return filteredAssets.slice(start, start + pageSize);
        }, [filteredAssets, currentPage]);
        React.useEffect(() => { setCurrentPage(1); }, [filteredAssets.length, sortOption]);
        const handleAssetUpdate = (updatedAsset) => {
          setAssets(prev => prev.map(a => a.id === updatedAsset.id ? updatedAsset : a));
          setSelectedAsset(updatedAsset);
        };
        const handleAssetUpload = (newAsset) => { setAssets(prev => [newAsset, ...prev]); };
        return (
          <div className="min-h-screen flex flex-col bg-gray-50">
            <Header 
              searchQuery={searchQuery} 
              setSearchQuery={setSearchQuery} 
              viewMode={viewMode} 
              setViewMode={setViewMode} 
              editMode={editMode} 
              toggleEditMode={toggleEditMode}
              onOpenLineage={handleOpenLineage}
            />
            
            {/* Main Navigation Tabs */}
            <div className="bg-white border-b border-gray-200 shadow-sm">
              <div className="container mx-auto px-4">
                <nav className="flex space-x-8">
                  <button
                    onClick={() => setMainTab('assets')}
                    className={`py-4 px-2 border-b-2 font-medium text-sm transition-colors ${
                      mainTab === 'assets'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    📊 Assets Catalogue
                  </button>
                  <button
                    onClick={() => setMainTab('compliance')}
                    className={`py-4 px-2 border-b-2 font-medium text-sm transition-colors ${
                      mainTab === 'compliance'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    🛡️ Compliance & Regulations
                  </button>
                  <button
                    onClick={() => setMainTab('variables')}
                    className={`py-4 px-2 border-b-2 font-medium text-sm transition-colors ${
                      mainTab === 'variables'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    🔗 Variables
                  </button>
                  <button
                    onClick={() => setMainTab('analytics')}
                    className={`py-4 px-2 border-b-2 font-medium text-sm transition-colors ${
                      mainTab === 'analytics'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    📈 Analytics
                  </button>
                  <button
                    onClick={() => setMainTab('lineage')}
                    className={`py-4 px-2 border-b-2 font-medium text-sm transition-colors ${
                      mainTab === 'lineage'
                        ? 'border-blue-500 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                    }`}
                  >
                    🔗 Lineage
                  </button>
                </nav>
              </div>
            </div>
            
            <div className="container mx-auto px-4 py-4">
              {/* Assets Catalogue Tab */}
              {mainTab === 'assets' && (
                <>
                  <div className="flex flex-col md:flex-row gap-4">
                    <FilterSidebar typeOptions={{ Dataset: "Datasets", Dashboard: "Dashboards", Report: "Reports", "Data Procedures": "Data Procedures" }} businessAreaOptions={{ Customers: "Customers", Assets: "Assets", Finance: "Finance", Operations: "Operations" }} tagOptions={assets.reduce((acc, asset) => { asset.tags.forEach(tag => { acc[tag] = tag; }); return acc; }, {})} selectedTypeFilters={selectedTypeFilters} setSelectedTypeFilters={setSelectedTypeFilters} selectedBusinessFilters={selectedBusinessFilters} setSelectedBusinessFilters={setSelectedBusinessFilters} selectedTagFilters={selectedTagFilters} toggleTagFilter={toggleTagFilter} dateFrom={dateFrom} setDateFrom={setDateFrom} dateTo={dateTo} setDateTo={setDateTo} />
                <main className="flex-1 overflow-y-auto bg-white p-6 rounded shadow">
                  <div className="mb-4 flex items-center">
                    <label className="mr-2 text-sm text-gray-700">Sort by:</label>
                    <select value={sortOption} onChange={(e) => setSortOption(e.target.value)} className="border rounded px-2 py-1 text-sm focus:outline-none">
                      <option value="endorsed">Endorsed First</option>
                      <option value="name-asc">Name (A–Z)</option>
                      <option value="name-desc">Name (Z–A)</option>
                      <option value="lastUpdated-desc">Last Updated (Newest)</option>
                      <option value="lastUpdated-asc">Last Updated (Oldest)</option>
                    </select>
                  </div>
                  {paginatedAssets.length > 0 ? (
                    viewMode === "grid" ? (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {paginatedAssets.map(asset => (
                          <AssetCard 
                            key={asset.id} 
                            asset={asset} 
                            onClick={setSelectedAsset}
                            selectionMode={selectionMode}
                            isSelected={selectedAssetIds.has(asset.id)}
                            onSelectionChange={handleAssetSelection}
                          />
                        ))}
                      </div>
                    ) : (
                      <div className="space-y-4">
                        {paginatedAssets.map(asset => (
                          <AssetCard 
                            key={asset.id} 
                            asset={asset} 
                            onClick={setSelectedAsset}
                            selectionMode={selectionMode}
                            isSelected={selectedAssetIds.has(asset.id)}
                            onSelectionChange={handleAssetSelection}
                          />
                        ))}
                      </div>
                    )
                  ) : (
                    <div className="text-center text-gray-500 mt-10">No assets found matching your criteria.</div>
                  )}
                  <div className="mt-6 flex justify-center items-center space-x-4">
                    <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="px-4 py-2 bg-gray-200 rounded disabled:opacity-50 transition-colors">
                      Previous
                    </button>
                    <span className="text-sm text-gray-700">Page {currentPage} of {Math.ceil(filteredAssets.length / pageSize)}</span>
                    <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, Math.ceil(filteredAssets.length / pageSize)))} disabled={currentPage === Math.ceil(filteredAssets.length / pageSize)} className="px-4 py-2 bg-gray-200 rounded disabled:opacity-50 transition-colors">
                      Next
                    </button>
                  </div>
                </main>
              </div>
              
              {/* Data Management Actions */}
              <div className="mt-8 border-t border-gray-200 pt-6">
                <div className="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                  <div className="bg-gray-50 px-6 py-4 border-b border-gray-200">
                    <h3 className="text-lg font-semibold text-gray-900 flex items-center">
                      <svg className="w-5 h-5 mr-2 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                            <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>

                      </div>

                        <div className="flex items-center mb-3">
                          <svg className="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                          </svg>
                          <h4 className="text-md font-medium text-gray-900">Export Data</h4>
                        </div>
                        <AssetExport assets={assets} />

                              </svg>
                            </div>
                            <p className="text-sm text-gray-500 mb-4">Select multiple assets to perform bulk operations</p>

                              <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                              </svg>
                              Enable Selection Mode
                            </button>

                            <div className="bg-purple-50 border border-purple-200 rounded-lg p-4">

                                <span className="text-sm font-medium text-purple-900">
                                  {selectedAssetIds.size} asset{selectedAssetIds.size === 1 ? '' : 's'} selected
                                </span>
                                <button
                                  onClick={toggleSelectionMode}
                                  className="text-xs text-purple-600 hover:text-purple-800 underline"
                                >
                                  Exit Selection
                                </button>
                              </div>
                              
                              <div className="flex space-x-2 mb-3">
                                <button
                                  onClick={selectAllAssets}
                                  className="flex-1 px-3 py-2 text-xs bg-purple-100 text-purple-800 rounded hover:bg-purple-200 transition-colors"
                                >
                                  Select All ({filteredAssets.length})
                                </button>
                                <button
                                  onClick={clearSelection}

                                >
                                  Clear Selection
                                </button>

                              <button

                                <svg className="w-4 h-4 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                Bulk Operations
                              </button>
                            </div>
                            
                            <div className="text-xs text-gray-600">
                              <div className="font-medium mb-1">Available Operations:</div>
                              <ul className="space-y-1 text-gray-500">

                                <li>• Change owner & contact info</li>
                                <li>• Modify classification levels</li>
                                <li>• Update business areas</li>
                                <li>• Set compliance criticality</li>
                                <li>• Toggle endorsement status</li>
                              </ul>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
                </>
              )}

              {/* Compliance & Regulations Tab */}
              {mainTab === 'compliance' && (
                <div className="max-w-6xl mx-auto">
                  <div className="mb-6">
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">Compliance & Regulations Registry</h1>
                    <p className="text-gray-600">Manage regulatory requirements and track asset compliance status</p>
                  </div>
                  
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Compliance Requirements */}
                    <div className="lg:col-span-2">
                      <div className="bg-white rounded-lg shadow-md p-6">
                        <h2 className="text-xl font-semibold text-gray-900 mb-4">📋 Regulatory Requirements</h2>
                        <div className="space-y-4">
                          {Object.entries(COMPLIANCE_REGISTRY || {}).map(([id, compliance]) => (
                            <div key={id} className="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow cursor-pointer" onClick={() => setSelectedCompliance(compliance)}>
                              <div className="flex items-start justify-between mb-3">
                                <div className="flex-1">
                                  <h3 className="font-semibold text-gray-900 hover:text-blue-600 transition-colors">{compliance.title}</h3>
                                  <p className="text-sm text-gray-600 mt-1">{compliance.description}</p>
                                </div>
                                <span className={`px-2 py-1 rounded text-xs font-medium ${
                                  compliance.status === 'active' ? 'bg-green-100 text-green-800' :
                                  compliance.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                  'bg-red-100 text-red-800'
                                }`}>
                                  {compliance.status || 'Active'}
                                </span>
                              </div>
                              
                              <div className="grid grid-cols-2 gap-4 text-sm text-gray-600 mb-3">
                                <div>
                                  <span className="font-medium">Regulatory Body:</span>
                                  <p>{compliance.regulatoryBody}</p>
                                </div>
                                <div>
                                  <span className="font-medium">Effective Date:</span>
                                  <p>{compliance.effectiveDate}</p>
                                </div>
                                <div>
                                  <span className="font-medium">Review Frequency:</span>
                                  <p>{compliance.reviewFrequency}</p>
                                </div>
                                <div>
                                  <span className="font-medium">Criticality:</span>
                                  <span className={`px-2 py-1 rounded text-xs font-medium ${
                                    compliance.criticality === 'High' ? 'bg-red-100 text-red-800' :
                                    compliance.criticality === 'Medium' ? 'bg-yellow-100 text-yellow-800' :
                                    'bg-green-100 text-green-800'
                                  }`}>
                                    {compliance.criticality || 'Medium'}
                                  </span>
                                </div>
                              </div>
                              
                              {/* Linked Assets */}
                              <div>
                                <span className="text-sm font-medium text-gray-700">Linked Assets ({(compliance.linkedAssetIDs || []).length}):</span>
                                <div className="flex flex-wrap gap-1 mt-1">
                                  {(compliance.linkedAssetIDs || []).slice(0, 5).map(assetId => {
                                    const asset = assets.find(a => a.id.toString() === assetId.toString());
                                    return (
                                      <span key={assetId} className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">
                                        {asset ? asset.name : `Asset ${assetId}`}
                                      </span>
                                    );
                                  })}
                                  {(compliance.linkedAssetIDs || []).length > 5 && (
                                    <span className="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">
                                      +{compliance.linkedAssetIDs.length - 5} more
                                    </span>
                                  )}
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                    
                    {/* Compliance Summary */}
                    <div className="space-y-6">
                      <div className="bg-white rounded-lg shadow-md p-6">
                        <h2 className="text-xl font-semibold text-gray-900 mb-4">📊 Compliance Overview</h2>
                        <div className="space-y-4">
                          <div className="text-center">
                            <div className="text-3xl font-bold text-green-600">
                              {Object.keys(COMPLIANCE_REGISTRY || {}).length}
                            </div>
                            <div className="text-sm text-gray-600">Total Requirements</div>
                          </div>
                          
                          <div className="text-center">
                            <div className="text-2xl font-bold text-blue-600">
                              {assets.reduce((count, asset) => {
                                const hasCompliance = Object.values(COMPLIANCE_REGISTRY || {}).some(comp => 
                                  (comp.linkedAssetIDs || []).includes(asset.id.toString())
                                );
                                return count + (hasCompliance ? 1 : 0);
                              }, 0)}
                            </div>
                            <div className="text-sm text-gray-600">Assets with Compliance</div>
                          </div>
                        </div>
                      </div>
                      
                      <div className="bg-white rounded-lg shadow-md p-6">
                        <h2 className="text-xl font-semibold text-gray-900 mb-4">🎯 Quick Actions</h2>
                        <div className="space-y-2">
                          <button 
                            onClick={() => setShowComplianceImportForm(true)}
                            className="w-full px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors"
                          >
                            Add New Requirement
                          </button>
                          <button 
                            onClick={handleExportComplianceReport}
                            className="w-full px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition-colors"
                          >
                            Export Compliance Report
                          </button>
                          <button 
                            onClick={handleScheduleReview}
                            className="w-full px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 transition-colors"
                          >
                            Schedule Review
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Variables Tab */}
              {mainTab === 'variables' && (
                <div className="max-w-7xl mx-auto">
                  <div className="mb-6">
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">🔗 Enterprise Variable View</h1>
                    <p className="text-gray-600">Identify and analyze common variables across your data assets</p>
                  </div>
                  
                  {(() => {
                    // Generate variables analysis with manual links
                    const allVariables = VariableAnalyzer.extractVariables(assets, manualVariableLinks);
                    const governance = VariableAnalyzer.analyzeGovernance(allVariables);
                    const similarPatterns = VariableAnalyzer.findSimilarVariables(allVariables);
                    
                    // Filter variables based on search and filter
                    const filteredVariables = allVariables.filter(variable => {
                      const matchesSearch = !variableSearchQuery || 
                        variable.name.toLowerCase().includes(variableSearchQuery.toLowerCase()) ||
                        Array.from(variable.descriptions).some(desc => 
                          desc.toLowerCase().includes(variableSearchQuery.toLowerCase())
                        );
                      
                      switch(variableFilter) {
                        case 'cross-asset':
                          return matchesSearch && variable.assetCount > 1;
                        case 'high-sensitivity':
                          return matchesSearch && Array.from(variable.sensitivities).some(s => 
                            s && s.toLowerCase() === 'high'
                          );
                        case 'inconsistent':
                          return matchesSearch && variable.types.size > 1;
                        default:
                          return matchesSearch;
                      }
                    });
                    
                    return (
                      <>
                        {/* Summary Statistics */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                          <div className="bg-white rounded-lg shadow-md p-6">
                            <div className="flex items-center">
                              <div className="p-3 rounded-full bg-blue-100 text-blue-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                                </svg>
                              </div>
                              <div className="ml-4">
                                <h3 className="text-lg font-semibold text-gray-900">{allVariables.length}</h3>
                                <p className="text-gray-600 text-sm">Total Variables</p>
                              </div>
                            </div>
                          </div>
                          
                          <div className="bg-white rounded-lg shadow-md p-6">
                            <div className="flex items-center">
                              <div className="p-3 rounded-full bg-green-100 text-green-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                                </svg>
                              </div>
                              <div className="ml-4">
                                <h3 className="text-lg font-semibold text-gray-900">{governance.crossAssetIdentifiers.length}</h3>
                                <p className="text-gray-600 text-sm">Cross-Asset Variables</p>
                              </div>
                            </div>
                          </div>
                          
                          <div className="bg-white rounded-lg shadow-md p-6">
                            <div className="flex items-center">
                              <div className="p-3 rounded-full bg-red-100 text-red-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                              </div>
                              <div className="ml-4">
                                <h3 className="text-lg font-semibold text-gray-900">{governance.highSensitivity.length}</h3>
                                <p className="text-gray-600 text-sm">High Sensitivity</p>
                              </div>
                            </div>
                          </div>
                          
                          <div className="bg-white rounded-lg shadow-md p-6">
                            <div className="flex items-center">
                              <div className="p-3 rounded-full bg-yellow-100 text-yellow-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                                </svg>
                              </div>
                              <div className="ml-4">
                                <h3 className="text-lg font-semibold text-gray-900">{governance.inconsistentTypes.length}</h3>
                                <p className="text-gray-600 text-sm">Type Inconsistencies</p>
                              </div>
                            </div>
                          </div>
                        </div>
                        
                        {/* Search and Filter Controls */}
                        <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                          <div className="flex flex-col md:flex-row gap-4">
                            <div className="flex-1">
                              <input
                                type="text"
                                placeholder="Search variables by name or description..."
                                value={variableSearchQuery}
                                onChange={(e) => setVariableSearchQuery(e.target.value)}
                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              />
                            </div>
                            <div className="flex gap-2">
                              <select
                                value={variableFilter}
                                onChange={(e) => setVariableFilter(e.target.value)}
                                className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              >
                                <option value="all">All Variables</option>
                                <option value="cross-asset">Cross-Asset Variables</option>
                                <option value="high-sensitivity">High Sensitivity</option>
                                <option value="inconsistent">Type Inconsistencies</option>
                              </select>
                              <button
                                onClick={() => setShowVariableLinkingModal(true)}
                                className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors flex items-center space-x-2"
                              >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                                </svg>
                                <span>Link Variables</span>
                              </button>
                            </div>
                          </div>
                        </div>
                        
                        {/* Variables Grid */}
                        <div className="bg-white rounded-lg shadow-md">
                          <div className="p-6 border-b">
                            <h2 className="text-xl font-semibold text-gray-900">
                              Variables ({filteredVariables.length})
                            </h2>
                          </div>
                          
                          <div className="divide-y divide-gray-200">
                            {filteredVariables.map((variable, index) => (
                              <div 
                                key={index} 
                                className="p-6 hover:bg-gray-50 cursor-pointer transition-colors"

                                <div className="flex items-start justify-between">
                                  <div className="flex-1">
                                    <div className="flex items-center space-x-3 mb-2">

                                      {variable.isManuallyLinked && (
                                        <span className="px-2 py-1 bg-purple-100 text-purple-800 rounded text-xs font-medium">
                                          🔗 Manually Linked
                                        </span>

                                          <span className="px-2 py-1 bg-purple-100 text-purple-800 rounded text-xs">🔑 ID</span>

                                          <span className="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">📅 Date</span>
                                        )}
                                        {variable.commonPatterns.isEmail && (
                                          <span className="px-2 py-1 bg-orange-100 text-orange-800 rounded text-xs">📧 Email</span>
                                        )}
                                        {variable.commonPatterns.isAmount && (
                                          <span className="px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs">💰 Amount</span>
                                        )}

                                            <span key={type} className="inline-block bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs mr-1">
                                              {type}
