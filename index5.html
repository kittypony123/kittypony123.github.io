                                          ))}
                                          {variable.types.size > 3 && (
                                            <span className="text-xs text-gray-500">+{variable.types.size - 3} more</span>
                                          )}
                                        </div>
                                      </div>
                                      
                                      <div>
                                        <span className="font-medium">Sensitivity:</span>
                                        <div className="mt-1">
                                          {Array.from(variable.sensitivities).map(sensitivity => (
                                            <span key={sensitivity} className={`inline-block px-2 py-1 rounded text-xs mr-1 ${
                                              sensitivity === 'high' ? 'bg-red-100 text-red-800' :
                                              sensitivity === 'medium' ? 'bg-yellow-100 text-yellow-800' :
                                              'bg-green-100 text-green-800'
                                            }`}>
                                              {sensitivity}
                                            </span>
                                          ))}
                                        </div>
                                      </div>
                                      
                                      <div>
                                        <span className="font-medium">Assets:</span>
                                        <div className="mt-1">
                                          {variable.occurrences.slice(0, 2).map((occurrence, i) => (
                                            <span key={i} className="inline-block bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs mr-1">
                                              {occurrence.assetName}
                                            </span>
                                          ))}
                                          {variable.occurrences.length > 2 && (
                                            <span className="text-xs text-gray-500">+{variable.occurrences.length - 2} more</span>
                                          )}
                                        </div>
                                      </div>
                                    </div>
                                    
                                    {Array.from(variable.descriptions).length > 0 && (
                                      <p className="mt-2 text-sm text-gray-700">
                                        {Array.from(variable.descriptions)[0]}
                                      </p>
                                    )}
                                  </div>
                                  
                                  <div className="ml-4">
                                    <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/>
                                    </svg>
                                  </div>
                                </div>
                              </div>
                            ))}
                            
                            {filteredVariables.length === 0 && (
                              <div className="p-12 text-center text-gray-500">
                                <div className="text-4xl mb-4">🔍</div>
                                <h3 className="text-lg font-medium mb-2">No variables found</h3>
                                <p>Try adjusting your search query or filter criteria.</p>
                              </div>
                            )}
                          </div>
                        </div>
                      </>
                    );
                  })()}
                </div>
              )}

              {/* Analytics Tab */}
              {mainTab === 'analytics' && (
                <div className="max-w-6xl mx-auto">
                  <div className="mb-6">
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">Analytics Dashboard</h1>
                    <p className="text-gray-600">Insights and metrics from your data catalogue</p>
                  </div>
                  
                  <div className="bg-white rounded-lg shadow-md p-6">
                    <div className="text-center text-gray-500 py-12">
                      <div className="text-6xl mb-4">📈</div>
                      <h3 className="text-xl font-semibold mb-2">Analytics Coming Soon</h3>
                      <p>Advanced analytics and reporting features will be available in a future update.</p>
                    </div>
                  </div>
                </div>
              )}

              {mainTab === 'lineage' && (
                <div className="max-w-6xl mx-auto">
                  <div className="mb-6">
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">Data Lineage</h1>
                    <p className="text-gray-600">Map and visualize your data flows and transformations</p>
                  </div>
                  
                  {/* Lineage Projects List */}
                  {!selectedLineageProject ? (
                    <div className="space-y-6">
                      {/* Create New Project Button */}
                      <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex items-center justify-between">
                          <div>
                            <h3 className="text-lg font-semibold text-gray-900">Lineage Projects</h3>
                            <p className="text-gray-600">Create and manage your data lineage mappings</p>
                          </div>
                          <button
                            onClick={() => {
                              const newProject = {
                                id: Date.now(),
                                name: 'New Lineage Project',
                                created: new Date().toISOString(),
                                data: {
                                  general: { projectName: '', businessPurpose: '', dataOwner: '' },
                                  sources: [],
                                  processing: {},
                                  intermediate: [],
                                  outputs: [],
                                  metadata: {
                                    created: new Date().toISOString(),
                                    lastModified: new Date().toISOString(),
                                    version: "2.0",
                                    title: "Data Lineage Documentation"
                                  }
                                }
                              };
                              setCurrentLineageData(newProject.data);
                              setSelectedLineageProject(newProject);
                              setLineageActiveTab('general');
                            }}
                            className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                          >
                            🔗 New Lineage Project
                          </button>
                        </div>
                      </div>

                      {/* Existing Projects */}
                      {lineageProjects.length > 0 && (
                        <div className="bg-white rounded-lg shadow">
                          <div className="p-6 border-b">
                            <h3 className="text-lg font-semibold text-gray-900">Existing Projects</h3>
                          </div>
                          <div className="divide-y">
                            {lineageProjects.map((project) => (
                              <div key={project.id} className="p-6 hover:bg-gray-50 cursor-pointer" 
                                   onClick={() => {
                                     setSelectedLineageProject(project);
                                     setCurrentLineageData(project.data);
                                     setLineageActiveTab('general');
                                   }}>
                                <div className="flex items-center justify-between">
                                  <div>
                                    <h4 className="font-medium text-gray-900">
                                      {project.data.general.projectName || 'Untitled Project'}
                                    </h4>
                                    <p className="text-sm text-gray-600 mt-1">
                                      {project.data.general.businessPurpose || 'No description'}
                                    </p>
                                    <p className="text-xs text-gray-500 mt-1">
                                      Created: {new Date(project.created).toLocaleDateString()}
                                    </p>
                                  </div>
                                  <div className="flex items-center space-x-4">
                                    <div className="text-right text-sm text-gray-500">
                                      <div>Sources: {project.data.sources.length}</div>
                                      <div>Outputs: {project.data.outputs.length}</div>
                                    </div>
                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setLineageProjects(lineageProjects.filter(p => p.id !== project.id));
                                      }}
                                      className="text-red-500 hover:text-red-700"
                                    >
                                      🗑️
                                    </button>
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Empty State */}
                      {lineageProjects.length === 0 && (
                        <div className="bg-white rounded-lg shadow">
                          <div className="text-center py-12 text-gray-500">
                            <div className="text-6xl mb-4">🔗</div>
                            <h3 className="text-xl font-semibold mb-2">No Lineage Projects Yet</h3>
                            <p className="mb-6">Create your first lineage project to start mapping data flows</p>
                          </div>
                        </div>
                      )}
                    </div>
                  ) : (
                    /* Lineage Builder */
                    <div>
                      {/* Back Button and Save */}
                      <div className="bg-white rounded-lg shadow p-4 mb-6">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-4">
                            <button
                              onClick={() => {
                                // Save current project before going back
                                if (selectedLineageProject.id && currentLineageData.general.projectName) {
                                  const updatedProject = { ...selectedLineageProject, data: currentLineageData };
                                  const updatedProjects = lineageProjects.some(p => p.id === selectedLineageProject.id)
                                    ? lineageProjects.map(p => p.id === selectedLineageProject.id ? updatedProject : p)
                                    : [...lineageProjects, updatedProject];
                                  setLineageProjects(updatedProjects);
                                  
                                  // Update bidirectional asset-lineage links
                                  updateAssetLineageLinks(updatedProject);
                                }
                                setSelectedLineageProject(null);
                              }}
                              className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors"
                            >
                              ← Back to Projects
                            </button>
                            <div>
                              <h2 className="font-semibold text-gray-900">
                                {currentLineageData.general.projectName || 'Untitled Project'}
                              </h2>
                              <p className="text-sm text-gray-600">
                                Last modified: {new Date(currentLineageData.metadata.lastModified).toLocaleString()}
                              </p>
                            </div>
                          </div>
                          <button
                            onClick={() => {
                              // Save project
                              if (currentLineageData.general.projectName) {
                                const updatedProject = { ...selectedLineageProject, data: currentLineageData };
                                const updatedProjects = lineageProjects.some(p => p.id === selectedLineageProject.id)
                                  ? lineageProjects.map(p => p.id === selectedLineageProject.id ? updatedProject : p)
                                  : [...lineageProjects, updatedProject];
                                setLineageProjects(updatedProjects);
                                
                                // Update bidirectional asset-lineage links
                                updateAssetLineageLinks(updatedProject);
                                alert('Lineage project saved successfully!');
                              } else {
                                alert('Please enter a project name before saving.');
                              }
                            }}
                            className="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors"
                          >
                            💾 Save Project
                          </button>
                        </div>
                      </div>

                      {/* Lineage Builder Component */}
                      <LineageBuilder
                        currentData={currentLineageData}
                        onDataChange={setCurrentLineageData}
                        activeTab={lineageActiveTab}
                        onTabChange={setLineageActiveTab}
                        assets={assets}
                        onCreateAsset={handleCreateAsset}
                      />
                    </div>
                  )}
                </div>
              )}
            </div>
            <GlossaryToggle />
            {selectedAsset && (
              <DetailPanel asset={selectedAsset} onClose={() => setSelectedAsset(null)} onAssetUpdate={handleAssetUpdate} editMode={editMode} onAssetSelect={handleLinkedAssetSelect} setSelectedCompliance={setSelectedCompliance} onOpenLineage={handleOpenLineage} onOpenLineageProject={handleOpenLineageProject} />
            )}
            {selectedCompliance && (
              <ComplianceDetailModal 
                compliance={selectedCompliance} 
                onClose={() => setSelectedCompliance(null)} 
                assets={assets} 
                onAssetSelect={setSelectedAsset}
              />
            )}
            {selectedVariable && (
              <VariableDetailModal 
                variable={selectedVariable} 
                onClose={() => setSelectedVariable(null)} 
                assets={assets}
              />
            )}
            {showVariableLinkingModal && (
              <VariableLinkingModal 
                onClose={() => setShowVariableLinkingModal(false)} 
                assets={assets}
                manualLinks={manualVariableLinks}
                onSaveLinks={setManualVariableLinks}
              />
            )}
            {showAssetImportForm && (
              <AssetImportFormModal 
                onClose={() => setShowAssetImportForm(false)} 
                onAssetAdd={handleAssetAdd} 
                assets={assets} 
              />
            )}
            {showComplianceImportForm && (
              <ComplianceImportFormModal 
                onClose={() => setShowComplianceImportForm(false)} 
                onComplianceAdd={handleComplianceAdd} 
                assets={assets} 
                existingCompliances={COMPLIANCE_REGISTRY}
              />
            )}
            {showBulkOperationsPanel && (
              <BulkOperationsPanel
                selectedAssets={getSelectedAssets()}
                onClose={() => setShowBulkOperationsPanel(false)}
                onBulkUpdate={handleBulkUpdate}
                assets={assets}
              />
            )}
          </div>
        );
      };

      /**********************************************************************
       * Glossary Toggle Component – Fixed Button with Overlay.
       **********************************************************************/
      const GlossaryToggle = () => {
        const [showGlossary, setShowGlossary] = React.useState(false);
        return (
          <>
            {!showGlossary && (
              <button onClick={() => setShowGlossary(true)} className="fixed bottom-6 right-6 bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-3 rounded-2xl shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200 font-medium backdrop-blur-sm border border-blue-400/20" data-testid="glossary-toggle">
                📚 Business Glossary
              </button>
            )}
            {showGlossary && (
              <div className="fixed inset-0 bg-white z-50 overflow-y-auto">
                <button onClick={() => setShowGlossary(false)} className="absolute top-6 right-6 text-gray-600 bg-white hover:bg-gray-50 rounded-full p-3 shadow-lg hover:shadow-xl border border-gray-200 transition-all duration-200 font-medium" data-testid="glossary-close">
                  ✕ Close
                </button>
                <Glossary />
              </div>
            )}
          </>
        );
      };

      /**********************************************************************
       * Main Render
       **********************************************************************/
      ReactDOM.createRoot(document.getElementById('root')).render(
        <ErrorBoundary>
          <ToastProvider>
            <App />
          </ToastProvider>
        </ErrorBoundary>
      );
    </script>
  </body>
</html>
