<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; 
        }
        .form-select, .form-input, .form-checkbox {
            border-radius: 0.375rem; 
            border: 1px solid #d1d5db; 
            padding: 0.5rem 0.75rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: #2563eb; 
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25); 
        }
        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.15s ease-in-out;
            cursor: pointer;
            line-height: 1.5; 
        }
        .btn-primary {
            background-color: #2563eb; 
            color: white;
        }
        .btn-primary:hover {
            background-color: #1d4ed8; 
        }
        .btn:disabled {
            background-color: #9ca3af; 
            cursor: not-allowed;
        }
        .card {
            background-color: white;
            border-radius: 0.5rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); 
            padding: 1.5rem; 
            margin-bottom: 1.5rem;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e5e7eb; 
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2563eb; 
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
        #messageBox {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
            padding: 1rem 1.5rem; border-radius: 0.375rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000; opacity: 0; transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            font-weight: 500; min-width: 280px; text-align: center;
        }
        #messageBox.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #messageBox.success { background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        #messageBox.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        #loadingIndicator {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #2563eb; 
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="loadingIndicator" class="flex justify-center items-center">
        <div class="spinner"></div>
    </div>

    <div id="messageBox"></div>

    <div class="max-w-2xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Attendance Tracker</h1>
            <p class="text-gray-600">Select site and date to mark attendance for pre-registered individuals.</p>
        </header>

        <div class="card">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Session Details</h2>
            <div class="grid grid-cols-1 gap-4 mb-4">
                <div>
                    <label for="siteSelect" class="block text-sm font-medium text-gray-700 mb-1">Site</label>
                    <select id="siteSelect" class="form-select w-full">
                        <option value="">Select a Site</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Session</label>
                    <p id="sessionNameDisplay" class="form-input w-full bg-gray-50 text-gray-500 min-h-[38px] flex items-center">Select a site to see session</p>
                </div>
            </div>
            <div>
                <label for="attendanceDate" class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                <input type="date" id="attendanceDate" class="form-input w-full">
            </div>
            <button id="loadAttendanceBtn" class="btn btn-primary mt-6 w-full md:w-auto" disabled>Load Attendance Lists</button>
        </div>

        <div id="attendanceSection" class="hidden">
            <div class="card">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Registered Volunteers</h2>
                <div id="volunteersListDiv" class="space-y-2">
                </div>
            </div>

            <div class="card">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Registered Participants</h2>
                <div id="participantsListDiv" class="space-y-2">
                </div>
            </div>

            <div class="mt-6 text-center">
                <button id="saveAttendanceBtn" class="btn btn-primary w-full md:w-auto">Save Attendance</button>
            </div>
        </div>
    </div>

    <script>
        const siteSelect = document.getElementById('siteSelect');
        const sessionNameDisplay = document.getElementById('sessionNameDisplay');
        const attendanceDateInput = document.getElementById('attendanceDate');
        const loadAttendanceBtn = document.getElementById('loadAttendanceBtn');
        const attendanceSection = document.getElementById('attendanceSection');
        const volunteersListDiv = document.getElementById('volunteersListDiv');
        const participantsListDiv = document.getElementById('participantsListDiv');
        const saveAttendanceBtn = document.getElementById('saveAttendanceBtn');
        const messageBox = document.getElementById('messageBox');
        const loadingIndicator = document.getElementById('loadingIndicator');

        let currentSitesData = { sites: [], siteSessionInfo: {} }; 
        let currentSessionId = null; 
        let currentSessionName = ""; // To store the name for saving
        let currentSiteId = null;

        function showLoading(show) { loadingIndicator.style.display = show ? 'flex' : 'none'; }
        function showMessage(message, type = 'success', duration = 3500) {
            messageBox.textContent = message;
            // Clear existing type classes then add new ones
            messageBox.classList.remove('success', 'error', 'bg-green-100', 'text-green-800', 'border-green-300', 'bg-red-100', 'text-red-800', 'border-red-300');
            messageBox.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-full p-4 rounded-md shadow-lg z-[1000] opacity-0 transition-all ease-in-out duration-300 font-medium min-w-[280px] text-center'; // Base classes
            
            if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-300');
            } else if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-300');
            }
            
            requestAnimationFrame(() => { 
                messageBox.classList.add('show', '!opacity-100', '!translate-y-0');
            });
            if (messageBox.timeoutId) clearTimeout(messageBox.timeoutId);
            messageBox.timeoutId = setTimeout(() => {
                messageBox.classList.remove('show', '!opacity-100', '!translate-y-0');
            }, duration);
        }


        function populateSitesDropdown(sites) {
            siteSelect.innerHTML = '<option value="">Select a Site</option>'; 
            sites.forEach(site => {
                const option = document.createElement('option');
                option.value = site.id;
                option.textContent = site.name;
                siteSelect.appendChild(option);
            });
        }
        
        async function fetchInitialSiteData() {
            showLoading(true);
            try {
                const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkFgBmC8LvsOTZG3MeYayxURW4Zq4J0dvuDlk8d5tGYcMvMw_FfeJidKJJU6Q8JzycHw/exec'; // IMPORTANT: Replace this
                const response = await fetch(`${SCRIPT_URL}?action=getSites`);
                if (!response.ok) {
                    throw new Error(`Fetching sites: ${response.statusText} (${response.status})`);
                }
                const data = await response.json();
                if (!data || !data.sites || !data.siteSessionInfo) {
                    throw new Error("Invalid site data structure from server.");
                }
                currentSitesData = data; 
                populateSitesDropdown(data.sites);
            } catch (error) {
                console.error("Error fetching sites:", error);
                showMessage(`Error fetching site list: ${error.message}. Check console & Apps Script. Ensure URL is correct.`, 'error', 7000);
            } finally {
                showLoading(false);
            }
        }

        siteSelect.addEventListener('change', function() {
            currentSiteId = this.value;
            attendanceSection.classList.add('hidden'); 
            currentSessionId = null; 
            currentSessionName = "";
            loadAttendanceBtn.disabled = true;
            sessionNameDisplay.textContent = "Select a site to see session";
            sessionNameDisplay.classList.add('text-gray-500');


            if (currentSiteId) {
                const sessionInfo = currentSitesData.siteSessionInfo[currentSiteId];
                if (sessionInfo) {
                    sessionNameDisplay.textContent = sessionInfo.sessionName;
                    currentSessionName = sessionInfo.sessionName; // Store for saving
                    sessionNameDisplay.classList.remove('text-gray-500');
                    currentSessionId = sessionInfo.sessionId; 
                } else {
                    sessionNameDisplay.textContent = "No session defined for this site.";
                }
            }
            checkLoadButtonState();
        });

        attendanceDateInput.addEventListener('change', function() {
            attendanceSection.classList.add('hidden'); 
            checkLoadButtonState();
        });
        
        function checkLoadButtonState() {
            if (siteSelect.value && currentSessionId && attendanceDateInput.value) {
                loadAttendanceBtn.disabled = false;
            } else {
                loadAttendanceBtn.disabled = true;
            }
        }

        loadAttendanceBtn.addEventListener('click', async function() {
            const selectedDate = attendanceDateInput.value;

            if (!currentSessionId || !selectedDate) { 
                showMessage('Please select a valid site and date.', 'error');
                return;
            }
            
            showLoading(true);
            volunteersListDiv.innerHTML = ''; 
            participantsListDiv.innerHTML = ''; 
            try {
                const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkFgBmC8LvsOTZG3MeYayxURW4Zq4J0dvuDlk8d5tGYcMvMw_FfeJidKJJU6Q8JzycHw/exec'; // IMPORTANT: Replace this
                // The date parameter for getRegisteredAttendees is mostly for future use or if your script filters by it.
                // Currently, the Apps Script for getRegisteredAttendees primarily uses sessionId.
                const response = await fetch(`${SCRIPT_URL}?action=getRegisteredAttendees&sessionId=${currentSessionId}&date=${selectedDate}`);
                if (!response.ok) {
                     const errorData = await response.json().catch(() => ({ message: `HTTP error! Status: ${response.status}` }));
                    throw new Error(errorData.message || `HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                if (data.volunteers === undefined || data.participants === undefined) { // Check for presence, even if empty arrays
                     throw new Error("Invalid data structure for attendees from server.");
                }
                
                renderAttendanceLists(data.volunteers, data.participants);
                attendanceSection.classList.remove('hidden');
                if (data.volunteers.length === 0 && data.participants.length === 0) {
                    showMessage('No individuals pre-registered for this session. Lists are empty.', 'success', 4000);
                } else {
                    showMessage('Pre-registered lists loaded. Please mark attendance.', 'success');
                }

            } catch (error) {
                console.error("Error loading attendance data:", error);
                showMessage(`Error loading attendance data: ${error.message}. Check console & Apps Script.`, 'error', 6000);
                attendanceSection.classList.add('hidden'); // Hide section on error
            } finally {
                showLoading(false);
            }
        });

        function renderAttendanceLists(volunteers, participants) {
            volunteersListDiv.innerHTML = ''; 
            participantsListDiv.innerHTML = ''; 

            const createPersonItem = (person, type) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = person.name;
                nameSpan.className = 'text-gray-700';
                div.appendChild(nameSpan);

                const label = document.createElement('label');
                label.className = 'toggle-switch';
                
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.dataset.personId = person.id;
                input.dataset.personType = type; // Store type e.g. "Volunteer" or "Participant"
                input.dataset.personName = person.name; // Store name for saving
                
                const slider = document.createElement('span');
                slider.className = 'slider';

                label.appendChild(input);
                label.appendChild(slider);
                div.appendChild(label);
                
                return div;
            };

            if (volunteers && volunteers.length > 0) {
                volunteers.forEach(v => volunteersListDiv.appendChild(createPersonItem(v, "Volunteer")));
            } else {
                volunteersListDiv.innerHTML = '<p class="text-gray-500 text-sm">No volunteers registered for this session.</p>';
            }

            if (participants && participants.length > 0) {
                participants.forEach(p => participantsListDiv.appendChild(createPersonItem(p, "Participant")));
            } else {
                participantsListDiv.innerHTML = '<p class="text-gray-500 text-sm">No participants registered for this session.</p>';
            }
        }

        saveAttendanceBtn.addEventListener('click', async function() {
            if (!currentSiteId || !currentSessionId || !currentSessionName || !attendanceDateInput.value) {
                showMessage("Missing required session information. Cannot save attendance.", "error");
                return;
            }

            const attendancePayload = {
                siteId: currentSiteId,
                sessionId: currentSessionId,
                sessionName: currentSessionName,
                date: attendanceDateInput.value,
                records: []
            };

            // Collect all checkboxes from both volunteer and participant lists
            const checkboxes = [
                ...volunteersListDiv.querySelectorAll('input[type="checkbox"]'),
                ...participantsListDiv.querySelectorAll('input[type="checkbox"]')
            ];

            checkboxes.forEach(cb => {
                attendancePayload.records.push({
                    personId: cb.dataset.personId,
                    personName: cb.dataset.personName, 
                    personType: cb.dataset.personType, // e.g. "Volunteer"
                    status: cb.checked ? 'Present' : 'Absent'
                });
            });

            if (checkboxes.length === 0) { 
                showMessage('No individuals were loaded to mark attendance for. Nothing to save.', 'error', 4000);
                return;
            }
            // If checkboxes exist but none are checked, it still means data needs to be saved (all absent).
            // The condition above handles the case where no checkboxes were even rendered.

            showLoading(true);
            try {
                const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkFgBmC8LvsOTZG3MeYayxURW4Zq4J0dvuDlk8d5tGYcMvMw_FfeJidKJJU6Q8JzycHw/exec'; // IMPORTANT: Replace this
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', // Correct for sending JSON to Apps Script
                     },
                    body: JSON.stringify({action: 'saveAttendance', data: attendancePayload}) // Send action as part of the JSON body
                });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: `HTTP error! Status: ${response.status}` }));
                    throw new Error(errorData.message || `HTTP error! Status: ${response.status}`);
                }
                const result = await response.json();
                if (result.success) {
                    showMessage('Attendance saved successfully!', 'success');
                } else {
                    throw new Error(result.message || "Unknown error saving attendance on server.");
                }

            } catch (error) {
                console.error("Error saving attendance:", error);
                showMessage(`Error saving attendance: ${error.message}. Check console & Apps Script.`, 'error', 6000);
            } finally {
                showLoading(false);
            }
        });

        function initializeApp() {
            const today = new Date();
            const offset = today.getTimezoneOffset(); 
            const localToday = new Date(today.getTime() - (offset*60*1000)); 
            attendanceDateInput.value = localToday.toISOString().split('T')[0]; 
            
            fetchInitialSiteData(); 
            checkLoadButtonState();
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
