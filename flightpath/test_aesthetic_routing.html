<!DOCTYPE html>
<html>
<head>
    <title>Aesthetic Routing System Test</title>
    <script type="module">
        // Test the aesthetic routing system
        import { validateNetworkHarmony, analyzeNetworkAesthetics } from './src/systems/hexgrid.js';

        // Mock game object for testing
        const mockGame = {
            stations: [
                { x: 100, y: 100, id: 0, connections: [0] },
                { x: 300, y: 100, id: 1, connections: [0] },
                { x: 200, y: 200, id: 2, connections: [1] },
                { x: 400, y: 200, id: 3, connections: [1] }
            ],
            lines: [
                {
                    id: 0,
                    stations: [0, 1],
                    colorIndex: 0,
                    waypoints: [
                        { x: 100, y: 100 },
                        { x: 300, y: 100 }
                    ],
                    totalLength: 200
                },
                {
                    id: 1,
                    stations: [2, 3],
                    colorIndex: 1,
                    waypoints: [
                        { x: 200, y: 200 },
                        { x: 400, y: 200 }
                    ],
                    totalLength: 200
                }
            ],
            config: {
                hexGrid: { size: 44 }
            }
        };

        async function runTests() {
            console.log('=== Aesthetic Routing System Test ===');

            try {
                // Test network analysis
                console.log('\n1. Testing network analysis...');
                const analysis = analyzeNetworkAesthetics(mockGame);
                console.log('Network Analysis:', analysis);

                // Test harmony validation
                console.log('\n2. Testing harmony validation...');
                const harmony = validateNetworkHarmony(mockGame);
                console.log('Harmony Validation:', harmony);

                // Test with empty network
                console.log('\n3. Testing with empty network...');
                const emptyGame = { ...mockGame, lines: [], stations: [] };
                const emptyHarmony = validateNetworkHarmony(emptyGame);
                console.log('Empty Network Harmony:', emptyHarmony);

                console.log('\n=== All tests completed successfully! ===');

                // Display results on page
                document.body.innerHTML = `
                    <h1>Aesthetic Routing System Test Results</h1>
                    <div style="font-family: monospace; margin: 20px;">
                        <h2>Network Analysis:</h2>
                        <pre>${JSON.stringify(analysis, null, 2)}</pre>

                        <h2>Harmony Validation:</h2>
                        <pre>${JSON.stringify(harmony, null, 2)}</pre>

                        <h2>Test Status:</h2>
                        <p style="color: green; font-weight: bold;">✓ All tests passed successfully!</p>

                        <h2>Key Features Tested:</h2>
                        <ul>
                            <li>✓ Network aesthetics analysis</li>
                            <li>✓ Symmetry detection</li>
                            <li>✓ Visual balance calculation</li>
                            <li>✓ Spacing rhythm analysis</li>
                            <li>✓ Proportional harmony scoring</li>
                            <li>✓ Network unity measurement</li>
                            <li>✓ Harmony feedback generation</li>
                        </ul>

                        <p><strong>Harmony Score:</strong> ${Math.round(harmony.score * 100)}%</p>

                        ${harmony.recommendations.length > 0 ? `
                            <h3>Recommendations:</h3>
                            <ul>
                                ${harmony.recommendations.map(rec => `<li>${rec}</li>`).join('')}
                            </ul>
                        ` : ''}
                    </div>
                `;

            } catch (error) {
                console.error('Test failed:', error);
                document.body.innerHTML = `
                    <h1>Aesthetic Routing System Test</h1>
                    <div style="color: red; font-family: monospace; margin: 20px;">
                        <h2>❌ Test Failed</h2>
                        <pre>${error.message}</pre>
                        <p>Check console for detailed error information.</p>
                    </div>
                `;
            }
        }

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runTests);
        } else {
            runTests();
        }
    </script>
</head>
<body>
    <h1>Loading Aesthetic Routing System Test...</h1>
    <p>Please check the console for detailed test output.</p>
</body>
</html>
